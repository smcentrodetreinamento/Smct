    return h+`</div></details>`}
  const id=a.id;
  return `<div class="card"><div class="row between"><h3>Plano</h3>${venc?`<span class="pill p-bad">Vencido</span>`:p?`<span class="pill p-ok">${esc(p.nome)}</span>`:`<span class="pill p-neutral">Sem plano</span>`}</div>
  <form class="stack" data-form="plano" data-aluno="${id}"><div class="formgrid">
  <label>Plano<select id="pl_p_${id}"><option value="">Sem plano</option>${S.cfg.planos.map(x=>`<option value="${x.id}" ${x.id===a.plano?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>
  <label>Período<select id="pl_per_${id}" data-change="sugFim" data-id="${id}"><option value="">—</option>${Object.entries(PERIODOS).map(([k,v])=>`<option value="${k}" ${a.periodo===k?"selected":""}>${v[0]}</option>`).join("")}</select></label>
  <label>Data de início<input type="date" id="pl_ini_${id}" value="${esc(a.inicio||"")}" data-change="sugFim" data-id="${id}"></label>
  <label>Data fim<input type="date" id="pl_fim_${id}" value="${esc(a.fim||"")}"></label>
  <label>Pagamento<select id="pl_pag_${id}"><option value="mensal" ${a.pagamento!=="unico"?"selected":""}>Mensal</option><option value="unico" ${a.pagamento==="unico"?"selected":""}>Único</option></select></label>
  <label>Forma de pagamento<select id="pl_forma_${id}"><option value="">—</option>${FORMAS.map(f=>`<option ${a.forma===f?"selected":""}>${f}</option>`).join("")}</select></label>
  <label>Dia do pagamento<input type="number" min="1" max="31" id="pl_dia_${id}" value="${esc(a.diaPagamento||"")}" placeholder="Ex.: 10"></label>
  <label>Valor (R$)<input id="pl_val_${id}" inputmode="decimal" value="${a.valor?esc(String(a.valor).replace(".",",")):""}" placeholder="Ex.: 289,90"></label>
  <label>Professor (financeiro)<input id="pl_pf_${id}" list="pf_dl" value="${esc(a.profFin||"")}" placeholder="Ex.: SM|CT, Welker, Heitor"><datalist id="pf_dl">${[...new Set(["SM|CT",...profsFin(),...S.alunos.map(x=>x.profFin).filter(Boolean)])].map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
  <label>Vencimento (pagamento único)<input type="date" id="pl_vu_${id}" value="${esc(a.vencUnico||"")}"></label>
  <label>Vezes por semana<input type="number" min="1" max="7" id="pl_vz_${id}" value="${esc(a.vezesSemana||"")}" placeholder="Ex.: 2"></label>
  <label>Reposições por mês<input type="number" min="0" max="31" id="pl_rm_${id}" value="${esc(a.reposicoesMes===""||a.reposicoesMes==null?3:a.reposicoesMes)}"></label>
  <div style="grid-column:1/-1;display:grid;gap:6px"><span class="eyebrow">Modalidade adicional</span>${S.cfg.modalidades.length?`<div class="days">${S.cfg.modalidades.map((m,i)=>{const noPlano=p&&(p.modalidades||[]).includes(m);return `<label${noPlano?' title="Já está no plano"':""}><input type="checkbox" id="pl_mx_${id}_${i}" value="${esc(m)}" ${modsExtra(a).includes(m)?"checked":""} ${noPlano?"disabled":""}>${esc(m)}${noPlano?" (no plano)":""}</label>`}).join("")}</div><div class="meta">Marque as modalidades que o aluno faz além do plano. Ele passa a ver e agendar esses horários.</div>`:`<div class="meta">Cadastre as modalidades em Ajustes.</div>`}</div>
  <label style="grid-column:1/-1">Observação financeira<input id="pl_ob_${id}" value="${esc(a.obsFin||"")}" placeholder="Ex.: 1x600 + 5x500, pago adiantado"></label>
  </div><div class="meta">Férias pelo período: trimestral 15 dias, semestral 20, anual 30. A data fim é preenchida sozinha pelo início e período; você pode ajustar. O dia do pagamento aparece para o aluno quando o pagamento é mensal.${pg?` Próximo: ${fmtFull(pg)}.`:""}</div><div><button class="small primary">Salvar plano</button></div></form></div>`}

function vAluno(){
  const opts=S.alunos.filter(a=>!a.responsavelId||!aluno(a.responsavelId)).sort((x,y)=>x.nome.localeCompare(y.nome));
  let h="";
  if(ROLE==="aluno"){if(!aluno(S.meu))return `<div class="card empty"><h3>Cadastro não encontrado</h3><span>Seu acesso ainda não está ligado a um cadastro de aluno. Fale com a recepção do estúdio.</span></div>`}
  else{h=`<div class="note">Prévia da área do aluno: escolha um aluno para ver a tela como ele vê. Cada aluno entra com o próprio acesso.</div>`;
  if(!S.alunos.length)return h+emptyStart();
  h+=`<label>Ver como<select id="meuSel" data-change="meu"><option value="">Escolha o aluno</option>${opts.map(a=>`<option value="${a.id}" ${a.id===S.meu?"selected":""}>${esc(a.nome)}</option>`).join("")}</select></label>`}
  if(false)h+=`<label>Quem é você?<select id="meuSel" data-change="meu"><option value="">Escolha seu nome</option>${opts.map(a=>`<option value="${a.id}" ${a.id===S.meu?"selected":""}>${esc(a.nome)}</option>`).join("")}</select></label>`;
  const eu=aluno(S.meu);if(!eu)return h;
  const deps=dependentes(eu);const a=deps.find(x=>x.id===S.perfil)||eu;
  if(deps.length)h+=`<div class="stack"><div class="eyebrow">Perfil</div><div class="chips" role="group" aria-label="Perfil">${[eu,...deps].map(x=>`<button class="chip" style="min-width:auto;padding:8px 14px" aria-pressed="${x.id===a.id}" data-act="perfil" data-v="${x.id}"><span style="font-weight:600">${x.id===eu.id?"Você":esc(x.nome.split(" ")[0])}</span></button>`).join("")}</div>${a.id!==eu.id?`<div class="meta">Você está agendando, desmarcando e avisando férias por ${esc(a.nome)}.</div>`:""}</div>`;
  const abriu=S.espera.filter(e=>e.alunoId===a.id&&e.status==="vaga"&&turma(e.turmaId)&&livres(e.turmaId,e.data)>0&&new Date(e.data+"T"+turma(e.turmaId).hora+":00").getTime()>Date.now());
  h+=`<div class="card ola"><div class="row" style="gap:14px">${avatar(a,56)}<div class="grow"><h2>${a.id===eu.id?`Olá, ${esc(eu.nome.split(" ")[0])}`:`Perfil de ${esc(a.nome)}`}</h2>${fotoBtn(a,a.foto?"Trocar foto":"Adicionar foto para o professor")}</div></div></div>`;
  for(const e of abriu){const t=turma(e.turmaId);h+=`<div class="card" style="border-color:var(--good)"><div class="row between"><div class="grow"><div class="eyebrow" style="color:var(--good)">Abriu vaga</div><div class="name">${esc(t.nome)} · ${relD(e.data)} às ${esc(t.hora)}</div></div><button class="primary small" data-act="pegarVaga" data-id="${e.id}">Pegar a vaga</button></div></div>`}
  const nv=diasAteNiver(a);if(nv===0)h+=`<div class="note">Feliz aniversário, ${esc(a.nome.split(" ")[0])}! Que seu novo ano seja cheio de saúde e movimento.</div>`;
  const nAv=avisosAtivos().filter(x=>x.importante).length;
  const subs=[["aulas","Minhas aulas"],["studio","Studio"],["avisos","Avisos"+(nAv?` <span class="badge">${nAv}</span>`:"")],["professor","Falar com professor"],["parceiros","Parceiros"],["loja","Loja"],["contrato","Contrato"+(contratoStatus(a).ok?"":` <span class="badge">!</span>`)]];
  h+=`<div class="tabrow" role="tablist" aria-label="Área do aluno">${subs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.subAluno===k}" data-act="subAluno" data-v="${k}">${l}</button>`).join("")}</div>`;
  const F={aulas:()=>painelAluno(a,"aluno"),studio:()=>alunoStudio(a),avisos:()=>alunoAvisos(a),professor:()=>alunoProfessor(a),parceiros:alunoParceiros,loja:()=>alunoLoja(a),contrato:()=>alunoContrato(a,eu)}[S.subAluno]||(()=>painelAluno(a,"aluno"));
  return h+`<div class="area-aluno">${F()}</div>`}

/* ---------- comunicação ---------- */
function brl(n){return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function parsePreco(s){return Number(String(s||"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."))||0}
function quando(iso){return iso?new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}
function avisosAtivos(){const hoje=ds(new Date());return S.avisos.filter(x=>!x.ate||x.ate>=hoje).sort((x,y)=>(y.importante-x.importante)||String(y.criadoEm).localeCompare(String(x.criadoEm)))}
function linkSeguro(u){u=String(u||"").trim();if(!u)return null;if(/^www\./i.test(u))u="https://"+u;return /^https?:\/\//i.test(u)?u:null}
const MSG_ST={novo:["Nova","p-wait"],visto:["Vista","p-neutral"],respondido:["Respondida","p-ok"]};
const PED_ST={novo:["Novo pedido","p-wait"],separado:["Separado","p-acc"],entregue:["Entregue","p-ok"],cancelado:["Cancelado","p-neutral"]};
function stPill(map,s){const x=map[s]||[s,"p-neutral"];return `<span class="pill ${x[1]}"><span class="dot"></span>${x[0]}</span>`}

function alunoAvisos(a){
  const L=avisosAtivos();
  let h=`<div class="stack"><h2>Avisos do estúdio</h2>`;
  if(!L.length)h+=`<div class="card empty">Nenhum aviso no momento.</div>`;
  for(const x of L)h+=`<div class="card" ${x.importante?'style="border-color:var(--warn)"':""}>${x.importante?`<div class="eyebrow" style="color:var(--warn)">Importante</div>`:""}<h3>${esc(x.titulo)}</h3>${x.texto?`<div style="white-space:pre-line">${esc(x.texto)}</div>`:""}<div class="meta">${quando(x.criadoEm)}</div></div>`;
  h+=`</div><div class="card"><h3>Deixe sua sugestão</h3><div class="meta">Ideias, elogios ou algo que podemos melhorar. A equipe lê todas.</div><form class="stack" data-form="sugestao" data-aluno="${a.id}"><textarea id="sg_${a.id}" rows="4" required placeholder="Escreva aqui…" style="font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical"></textarea><div><button class="primary small">Enviar sugestão</button></div></form></div>`;
  h+=minhasMensagens(a,"sugestao");
  return h}

function alunoProfessor(a){
  const now=Date.now(),lim=ds(new Date(now-14*864e5));
  const feitas=S.reservas.filter(r=>r.alunoId===a.id&&r.data>=lim&&inicio(r)<=now&&["presente","confirmado","agendado"].includes(r.status)).sort((x,y)=>inicio(y)-inicio(x));
  let h=`<div class="card"><h2>Falar com o professor</h2><div class="meta">Sentiu algum desconforto ou dor depois do treino? Conte para o professor da turma ajustar os exercícios na próxima aula. Em caso de dor forte, procure um médico.</div>
  <form class="stack" data-form="desconforto" data-aluno="${a.id}"><div class="formgrid">
  <label>Qual aula<select id="dc_aula_${a.id}">${feitas.map(r=>{const t=turma(r.turmaId)||{};return `<option value="${r.id}">${relD(r.data)} ${esc(t.hora||"")} · ${esc(t.nome||"Aula")}${t.professor?" ("+esc(t.professor)+")":""}</option>`}).join("")}<option value="">Outra / não lembro</option></select></label>
  <label>Onde sentiu<select id="dc_local_${a.id}">${["Lombar","Costas","Pescoço","Ombro","Braço / punho","Quadril","Joelho","Tornozelo / pé","Outro"].map(x=>`<option>${x}</option>`).join("")}</select></label>
  <label>Intensidade<select id="dc_int_${a.id}"><option value="leve">Leve</option><option value="moderado">Moderado</option><option value="forte">Forte</option></select></label></div>
  ${fotoPicker(a.id)}
  <label>Conte o que sentiu<textarea id="dc_txt_${a.id}" rows="4" required placeholder="Ex.: senti o joelho direito no agachamento, ficou incomodando no dia seguinte" style="font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical"></textarea></label>
  <div><button class="primary small">Enviar para o professor</button></div></form></div>`;
  return h+minhasMensagens(a,"desconforto")}

const FOTOS={};let assetsNs=null,assetsPronto=false;
function fotoPicker(aid){
  if(!assetsPronto)return `<div class="meta">Carregando envio de fotos…</div>`;
  if(!assetsNs)return `<div class="meta">O envio de fotos não está liberado neste acesso. Descreva no texto ou mostre ao professor na próxima aula.</div>`;
  const sel=FOTOS[aid]||[];
  return `<div class="stack"><div class="eyebrow">Fotos (opcional, até 3)</div><div class="meta">Uma foto do local, da postura ou do exercício ajuda o professor a entender e ajustar.</div><div class="thumbs">${sel.map((f,i)=>`<div class="thumb"><img src="${f.url}" alt="Foto ${i+1} selecionada"><button type="button" class="small" data-act="rmFotoSel" data-aluno="${aid}" data-i="${i}" aria-label="Remover foto">×</button></div>`).join("")}${sel.length<3?`<label class="thumb add"><input type="file" accept="image/*" multiple data-foto="${aid}" hidden><span>+ Adicionar foto</span></label>`:""}</div></div>`}
function fotosHtml(ids){if(!ids||!ids.length)return"";return `<div class="thumbs">${ids.map((id,i)=>`<button type="button" class="thumb" data-act="verFoto" data-v="${esc(id)}" aria-label="Ampliar foto ${i+1}"><img src="${esc(blobUrl(id))}" alt="Foto ${i+1} enviada pelo aluno" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'meta',textContent:'Foto indisponível'}))"></button>`).join("")}</div>`}
async function reduzir(file){
  try{const bmp=await createImageBitmap(file);const m=1600,s=Math.min(1,m/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));if(b)return b}catch(e){}
  if(["image/jpeg","image/png","image/webp","image/gif"].includes(file.type))return file;return null}
function minhasMensagens(a,tipo){
  const L=S.mensagens.filter(m=>m.alunoId===a.id&&m.tipo===tipo).sort((x,y)=>String(y.criadoEm).localeCompare(String(x.criadoEm)));
  if(!L.length)return"";
  return `<div class="card"><h3>${tipo==="sugestao"?"Suas sugestões":"Seus relatos"}</h3><div class="list">${L.slice(0,10).map(m=>`<div class="item" style="display:grid;gap:4px"><div class="row between"><span class="meta">${quando(m.criadoEm)}</span>${stPill(MSG_ST,m.status)}</div><div style="white-space:pre-line">${esc(m.texto)}</div>${fotosHtml(m.fotos)}${m.resposta?`<div class="note"><b>Resposta${m.respondidoPor?" de "+esc(m.respondidoPor):""}:</b> ${esc(m.resposta)}</div>`:""}</div>`).join("")}</div></div>`}

function alunoParceiros(){
  const L=S.parceiros.slice().sort((x,y)=>String(x.categoria||"").localeCompare(String(y.categoria||""))||x.nome.localeCompare(y.nome));
  let h=`<div class="stack"><h2>Parceiros</h2><div class="meta">Benefícios exclusivos para alunos.</div>`;
  if(!L.length)return h+`<div class="card empty">Em breve, novos parceiros por aqui.</div></div>`;
  for(const p of L){const ln=linkSeguro(p.link);
    h+=`<div class="card"><div class="row between"><div class="row grow" style="gap:12px;flex-wrap:nowrap">${logoParceiro(p,64)}<div style="min-width:0"><div class="eyebrow">${esc(p.categoria||"Parceiro")}</div><h3>${esc(p.nome)}</h3></div></div>${p.beneficio?`<span class="pill p-ok">${esc(p.beneficio)}</span>`:""}</div>${p.descricao?`<div style="white-space:pre-line">${esc(p.descricao)}</div>`:""}${p.cupom?`<div class="row"><span class="meta">Cupom:</span><span class="pill p-acc" style="user-select:all">${esc(p.cupom)}</span></div>`:""}<div class="contact">${ln?`<a class="btn small" href="${esc(ln)}" target="_blank" rel="noopener">Ver mais</a>`:""}${p.contato?`<span class="phone">${esc(p.contato)}</span>`:""}</div></div>`}
  return h+`</div>`}

function alunoLoja(a){
  const L=S.produtos.filter(p=>p.disponivel!==false).sort((x,y)=>x.nome.localeCompare(y.nome));
  let h=`<div class="stack"><h2>Nossa loja</h2><div class="meta">Peça pelo app e retire no estúdio. O pagamento é combinado na retirada.</div>`;
  if(!L.length)h+=`<div class="card empty">Nenhum produto disponível no momento.</div>`;
  for(const p of L)h+=`<div class="card prod">${blobUrl(p.foto)?`<div class="prod-img"><img src="${esc(blobUrl(p.foto))}" alt="${esc(p.nome)}" loading="lazy"></div>`:""}<div class="row between"><div class="grow"><h3>${esc(p.nome)}</h3>${p.descricao?`<div class="meta" style="white-space:pre-line">${esc(p.descricao)}</div>`:""}</div><span class="time" style="font-size:20px">${brl(p.preco)}</span></div><form class="row" data-form="pedido" data-aluno="${a.id}" data-produto="${p.id}">${p.opcoes?`<select id="po_${a.id}_${p.id}" aria-label="Opção" style="flex:1 1 140px">${String(p.opcoes).split(",").map(o=>o.trim()).filter(Boolean).map(o=>`<option>${esc(o)}</option>`).join("")}</select>`:""}<select id="pq_${a.id}_${p.id}" aria-label="Quantidade" style="width:auto">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select><button class="primary small">Pedir</button></form></div>`;
  const meus=S.pedidos.filter(x=>x.alunoId===a.id).sort((x,y)=>String(y.criadoEm).localeCompare(String(x.criadoEm)));
  if(meus.length)h+=`<div class="card"><h3>Seus pedidos</h3><div class="list">${meus.slice(0,10).map(x=>`<div class="item"><div class="grow"><div class="name">${x.qtd}× ${esc(x.produtoNome)}${x.opcao?" ("+esc(x.opcao)+")":""}</div><div class="meta">${quando(x.criadoEm)} · ${brl(x.total)}</div></div>${stPill(PED_ST,x.status)}${x.status==="novo"?`<button class="small ghost danger" data-act="cancelarPedido" data-id="${x.id}">Cancelar</button>`:""}</div>`).join("")}</div></div>`;
  return h+`</div>`}

function vComunicacao(){
  const nM=S.mensagens.filter(m=>m.status==="novo").length,nP=S.pedidos.filter(p=>p.status==="novo").length;
  const subs=[["mensagens","Mensagens"+(nM?` <span class="badge">${nM}</span>`:"")],["avisos","Avisos"],["parceiros","Parceiros"],["loja","Loja"+(nP?` <span class="badge">${nP}</span>`:"")]];
  let h=`<div class="tabrow" role="tablist" aria-label="Comunicação">${subs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.subCom===k}" data-act="subCom" data-v="${k}">${l}</button>`).join("")}</div>`;
  const ta=(id,ph,req)=>`<textarea id="${id}" rows="3" ${req?"required":""} placeholder="${ph}" style="font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical"></textarea>`;
  if(S.subCom==="mensagens"){
    const L=S.mensagens.slice().sort((x,y)=>(x.status==="novo"?0:1)-(y.status==="novo"?0:1)||String(y.criadoEm).localeCompare(String(x.criadoEm)));
    h+=`<div class="stack"><h2>Relatos e sugestões dos alunos</h2>`;
    if(!L.length)h+=`<div class="card empty">Quando um aluno relatar desconforto ou mandar sugestão pela área dele, aparece aqui.</div>`;
    for(const m of L.slice(0,60)){const a=aluno(m.alunoId)||{nome:"Aluno removido"};const r=m.reservaId&&S.reservas.find(x=>x.id===m.reservaId);const t=r&&turma(r.turmaId);

  if(S.subCom==="avisos"){

    h+=`<div class="card"><h3>Parceiros cadastrados</h3><div class="list">${S.parceiros.map(p=>`<div class="item">${logoParceiro(p,44)}<div class="grow"><div class="name">${esc(p.nome)}</div><label class="fotolink"><input type="file" accept="image/*" data-fotoparceiro="${p.id}" hidden>${p.foto?"Trocar foto":"Adicionar foto"}</label>${p.foto?` <button type="button" class="ghost small danger" data-act="rmFotoParceiro" data-id="${p.id}">Tirar foto</button>`:""}<div class="meta">${esc(p.categoria||"")}${p.beneficio?" · "+esc(p.beneficio):""}</div></div><button class="small" data-act="editar" data-col="parceiros" data-id="${p.id}">Editar</button><button class="small ghost danger" data-act="rmDoc" data-col="parceiros" data-id="${p.id}">Remover</button></div>`).join("")||`<div class="item meta">Nenhum parceiro ainda.</div>`}</div></div>`;

  h+=`<div class="card"><h3>Produtos</h3><div class="list">${S.produtos.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(p=>`<div class="item">${fotoProduto(p,56)}<div class="grow"><div class="name">${esc(p.nome)}</div><div class="meta">${brl(p.preco)}${p.opcoes?" · "+esc(p.opcoes):""}</div><div class="row" style="gap:4px;flex-wrap:nowrap"><label class="fotolink"><input type="file" accept="image/*" data-fotoproduto="${p.id}" hidden>${p.foto?"Trocar foto":"Adicionar foto"}</label>${p.foto?` <button style="min-height:0;padding:0 4px" type="button" class="ghost small danger" data-act="rmFotoProduto" data-id="${p.id}">Tirar foto</button>`:""}</div></div><button class="small ${p.disponivel===false?"":"ghost"}" data-act="toggleProd" data-id="${p.id}">${p.disponivel===false?"Esgotado":"Disponível"}</button><button class="small" data-act="editar" data-col="produtos" data-id="${p.id}">Editar</button><button class="small ghost danger" data-act="rmDoc" data-col="produtos" data-id="${p.id}">Remover</button></div>`).join("")||`<div class="item meta">Nenhum produto ainda.</div>`}</div></div>`;
  return h}

    if(a&&t&&ehStudio(t)&&a.profStudio&&t.professor&&normNome(t.professor)!==normNome(a.profStudio)){confirmSheet("Horário com outro professor",`<p>${st?esc(a.nome.split(" ")[0])+" tem":"Seu"} professor responsável ${st?"":"é "}<b>${esc(a.profStudio)}</b>. Este horário de ${esc(t.nome)} é com <b>${esc(t.professor)}</b>.</p><p class="meta">Pode agendar: o treino continua sendo montado por ${esc(a.profStudio)} e aparece no monitor da aula.</p>`,[{label:"Agendar mesmo assim",cls:"primary",run:()=>agendarFluxo(aid,tid,dv,k,st)}]);return}
    agendarFluxo(aid,tid,dv,k,st);return}
  if(act==="corMod"&&db){const m=b.dataset.m;run(()=>salvarCfg({modalidades:S.cfg.modalidades,planos:S.cfg.planos,cores:{[m]:b.dataset.v}}),"Cor salva");return}
  if(act==="subCom"){S.subCom=b.dataset.v;render();return}
  if(!db)return;
  if(act==="rmFotoSel"){const L=FOTOS[b.dataset.aluno]||[];const [f]=L.splice(+b.dataset.i,1);if(f)URL.revokeObjectURL(f.url);render();return}
  if(act==="verFoto"){const fid=b.dataset.v;S.sheet={render:()=>`<div class="row between"><h2>Foto do aluno</h2><button class="small" data-act="fechar">Fechar</button></div><img src="${esc(blobUrl(fid))}" alt="Foto ampliada" style="width:100%;border-radius:12px;background:var(--sunk)">`};render();return}
  if(act==="msgVista")run(()=>db.doc("mensagens/"+id).update({status:"visto"}),"Marcada como vista");
  if(act==="rmDoc"){const col=b.dataset.col;confirmSheet("Remover",`<p>Isso não pode ser desfeito.</p>`,[{label:"Remover",cls:"primary",run:()=>run(()=>db.doc(col+"/"+id).delete(),"Removido")}])}
  if(act==="pedSt")run(()=>db.doc("pedidos/"+id).update({status:b.dataset.v,atualizadoEm:new Date().toISOString()}),"Pedido atualizado");
  if(act==="cancelarPedido")run(()=>ROLE==="aluno"?SMCT.rpc("aluno_cancelar_pedido",{p_pedido:id}).then(depoisAluno):db.doc("pedidos/"+id).update({status:"cancelado",atualizadoEm:new Date().toISOString()}),"Pedido cancelado");
  if(act==="toggleProd"){const p=S.produtos.find(x=>x.id===id);if(p)run(()=>db.doc("produtos/"+id).update({disponivel:p.disponivel===false}),p.disponivel===false?"Produto disponível":"Marcado como esgotado")}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f||!db)return;e.preventDefault();
  const v=id=>((document.getElementById(id)||{}).value||"").trim();const k=f.dataset.form;const now=new Date().toISOString();
  if(k==="sugestao"){const aid=f.dataset.aluno,t=v("sg_"+aid);if(!t)return;run(async()=>{await db.collection("mensagens").add({tipo:"sugestao",alunoId:aid,texto:t,status:"novo",criadoEm:now});document.getElementById("sg_"+aid).value=""},"Sugestão enviada. Obrigado!")}
  if(k==="desconforto"){const aid=f.dataset.aluno,t=v("dc_txt_"+aid);if(!t)return;
    const sel=(FOTOS[aid]||[]).slice();let falhou=0;
    if(sel.length)toast("Enviando fotos…");
    run(async()=>{const ids=[];
      for(const fo of sel){try{const r=await assetsNs.upload(fo.blob,{type:fo.blob.type||"image/jpeg"});ids.push(r.id)}catch(err){console.error(err);falhou++}}
      await db.collection("mensagens").add({tipo:"desconforto",alunoId:aid,reservaId:v("dc_aula_"+aid)||null,local:v("dc_local_"+aid),intensidade:v("dc_int_"+aid),texto:t,fotos:ids,status:"novo",criadoEm:now});
      document.getElementById("dc_txt_"+aid).value="";sel.forEach(x=>URL.revokeObjectURL(x.url));FOTOS[aid]=[]},()=>falhou?`Enviado, mas ${falhou} ${falhou===1?"foto não subiu":"fotos não subiram"}. Tente uma imagem menor.`:"Enviado ao professor")}
  if(k==="responder"){const id=f.dataset.id,r=v("rp_"+id);if(!r){toast("Escreva a resposta");return}run(()=>db.doc("mensagens/"+id).update({resposta:r,respondidoPor:v("rpq_"+id),status:"respondido",respondidoEm:now}),"Resposta enviada")}
  if(k==="novoAviso"){const t=v("av_t");if(!t)return;run(async()=>{await db.collection("avisos").add({titulo:t,texto:v("av_x"),ate:v("av_ate"),importante:document.getElementById("av_imp").checked,criadoEm:now});["av_t","av_x","av_ate"].forEach(i=>document.getElementById(i).value="");document.getElementById("av_imp").checked=false},"Aviso publicado")}
  if(k==="novoParceiro"){const n=v("pa_n");if(!n)return;if(v("pa_l")&&!linkSeguro(v("pa_l"))){toast("O link precisa começar com https://");return}
    const arq=(document.getElementById("pa_foto")||{}).files;const file=arq&&arq[0];
    run(async()=>{let foto="";if(file){const blob=await reduzirLogo(file);if(!blob)throw new Error("formato");foto=(await assetsNs.upload(blob,{type:blob.type||"image/jpeg"})).id}
      await db.collection("parceiros").add({nome:n,categoria:v("pa_c"),beneficio:v("pa_b"),cupom:v("pa_cup"),link:linkSeguro(v("pa_l"))||"",contato:v("pa_ct"),descricao:v("pa_d"),foto,criadoEm:now});["pa_n","pa_c","pa_b","pa_cup","pa_l","pa_ct","pa_d","pa_foto"].forEach(i=>document.getElementById(i).value="")},"Parceiro adicionado")}
  if(k==="novoProduto"){const n=v("pr_n"),p=parsePreco(v("pr_p"));if(!n)return;if(!p){toast("Informe o preço, ex.: 89,90");return}
    const arqP=(document.getElementById("pr_foto")||{}).files;const fileP=arqP&&arqP[0];
    run(async()=>{let foto="";if(fileP){const blob=await reduzirLogo(fileP);if(!blob)throw new Error("formato");foto=(await assetsNs.upload(blob,{type:blob.type||"image/jpeg"})).id}
      await db.collection("produtos").add({nome:n,preco:p,opcoes:v("pr_o"),descricao:v("pr_d"),foto,disponivel:true,criadoEm:now});["pr_n","pr_p","pr_o","pr_d","pr_foto"].forEach(i=>document.getElementById(i).value="")},"Produto adicionado")}
  if(k==="pedido"){const aid=f.dataset.aluno,pid=f.dataset.produto;const p=S.produtos.find(x=>x.id===pid);if(!p)return;const q=parseInt(v("pq_"+aid+"_"+pid),10)||1;
    run(()=>ROLE==="aluno"?SMCT.rpc("aluno_pedido",{p_aluno:aid,p_produto:pid,p_opcao:v("po_"+aid+"_"+pid),p_qtd:q}).then(depoisAluno):db.collection("pedidos").add({alunoId:aid,produtoId:pid,produtoNome:p.nome,opcao:v("po_"+aid+"_"+pid),qtd:q,total:Math.round(p.preco*q*100)/100,status:"novo",criadoEm:now}),"Pedido enviado. Retire no estúdio.")}
});

function vAjustes(){
  const r=S.regras;
  let h=`<div class="card"><h2>Regras</h2><form class="formgrid" data-form="regras"><label>Nome do estúdio<input id="rg_nome" value="${esc(r.nome||"")}" placeholder="Seu estúdio"></label><label>Desmarcar com crédito até (minutos antes)<input id="rg_desm" type="number" min="0" step="5" value="${minDesm()}"></label><label>Gerar horários fixos para os próximos (dias)<input id="rg_dfx" type="number" min="1" max="60" value="${diasFixos()}"></label><div class="days" style="grid-column:1/-1"><label><input type="checkbox" id="rg_auto" ${autoOn()?"checked":""}>Gerar as aulas dos horários fixos automaticamente</label></div><div style="display:flex;align-items:end"><button class="primary" style="width:100%">Salvar regras</button></div></form></div>`;

  h+=cardModeloContrato();
  const C=S.cfg;
  h+=`<div class="card"><h2>Modalidades e planos</h2><div class="meta">Cadastre as modalidades, marque quais cada plano inclui e depois escolha a modalidade de cada turma. O aluno só vê os horários das modalidades do plano dele.</div>
  <div class="list">${C.modalidades.map(m=>`<div class="item mod" style="--m:${corMod(m)}"><span class="modtag" style="flex:1 1 140px">${esc(m)}</span><div class="row" role="group" aria-label="Cor de ${esc(m)}">${MOD_CORES.map(c=>`<button type="button" class="swatch" style="background:${c}" aria-pressed="${corMod(m)===c}" aria-label="Cor ${c}" data-act="corMod" data-m="${esc(m)}" data-v="${c}"></button>`).join("")}</div><button class="ghost small danger" data-act="rmMod" data-v="${esc(m)}">Remover</button></div>`).join("")||`<div class="item meta">Nenhuma modalidade ainda.</div>`}</div>
  <form class="row" data-form="novaMod"><input id="nm_nome" class="grow" style="flex:1 1 180px" placeholder="Ex.: Pilates, Jiu-Jitsu, Ginástica"><button class="small">Adicionar modalidade</button></form>
  ${C.planos.length?`<form class="stack" data-form="planos"><div class="list">${C.planos.map(p=>`<div class="item"><div class="grow" style="flex-basis:160px"><div class="name">${esc(p.nome)}</div></div><div class="days">${C.modalidades.map((m,i)=>`<label><input type="checkbox" id="pm_${p.id}_${i}" ${(p.modalidades||[]).includes(m)?"checked":""}>${esc(m)}</label>`).join("")||`<span class="meta">Cadastre modalidades acima</span>`}</div><button type="button" class="small ghost danger" data-act="rmPlano" data-id="${p.id}">Excluir</button></div>`).join("")}</div>${C.modalidades.length?`<div><button class="small primary">Salvar modalidades dos planos</button></div>`:""}</form>`:""}
  <form class="row" data-form="novoPlano"><input id="np_nome" class="grow" style="flex:1 1 180px" placeholder="Nome do plano"><button class="small">Adicionar plano</button></form></div>`;
  h+=`<div class="card"><h2>Turmas</h2><div class="list">`;
  const ts=S.turmas.slice().sort((x,y)=>x.hora.localeCompare(y.hora));
  if(!ts.length)h+=`<div class="item meta">Nenhuma turma ainda.</div>`;
  for(const t of ts)h+=`<div class="item"><span class="time" style="font-size:18px">${esc(t.hora)}</span><div class="grow"><div class="name">${esc(t.nome)}</div><div class="meta">${t.dias.map(d=>DIAS[d]).join(", ")} · ${esc(resumoVagas(t))}${t.professor?" · "+esc(t.professor):""}</div></div><select id="tm_${t.id}" data-change="turmaMod" data-id="${t.id}" aria-label="Modalidade" style="width:auto;min-height:32px;font-size:13px;padding:4px 8px"><option value="">Sem modalidade</option>${S.cfg.modalidades.map(m=>`<option ${t.modalidade===m?"selected":""}>${esc(m)}</option>`).join("")}</select><button class="small ${t.studio?"":"ghost"}" data-act="toggleStudio" data-id="${t.id}">${t.studio?"Studio":"Turma aberta"}</button><button class="small ${t.semCredito?"":"ghost"}" data-act="toggleCredito" data-id="${t.id}" title="Trocar se esta turma desconta crédito">${t.semCredito?"Não desconta crédito":"Desconta crédito"}</button><button class="small" data-act="editar" data-col="turmas" data-id="${t.id}">Editar</button><button class="small ghost danger" data-act="excluirTurma" data-id="${t.id}">Excluir</button>${fixosDaTurma(t)}</div>`;
  h+=`</div><form class="stack" data-form="novaTurma"><div class="formgrid"><label>Nome da turma<input id="nt_nome" required placeholder="Pilates Aparelho"></label><label>Horário<input id="nt_hora" type="time" required value="07:00"></label><label>Vagas<input id="nt_vagas" type="number" min="1" value="4"></label><label>Duração (min)<input id="nt_dur" type="number" min="10" value="50"></label><label>Professor(a)<input id="nt_prof"></label><label>Modalidade<select id="nt_mod"><option value="">Sem modalidade</option>${S.cfg.modalidades.map(m=>`<option>${esc(m)}</option>`).join("")}</select></label></div><div class="days" role="group" aria-label="Dias">${DIAS.map((d,i)=>`<label><input type="checkbox" id="nt_d${i}" value="${i}">${d}</label>`).join("")}</div><div class="days"><label><input type="checkbox" id="nt_studio">Aula de Studio</label><label><input type="checkbox" id="nt_semcred">Não descontar crédito (aula aberta, cortesia, evento)</label></div><div><button class="primary">Criar turma</button></div></form></div>`;
  const temEx=S.alunos.some(a=>a.exemplo)||S.turmas.some(t=>t.exemplo);
  h+=`<div class="card"><h2>Dados de exemplo</h2><div class="meta">Para testar o sistema sem mexer nos alunos reais.</div><div class="row">${temEx?`<button class="small danger" data-act="apagarExemplos">Apagar exemplos</button>`:`<button class="small" data-act="exemplos">Carregar exemplo</button>`}</div></div>`;
  return h}

function render(){
  const main=document.getElementById("main");
  const keep={};document.querySelectorAll("#main input,#main select,#main textarea,#sheetHost input,#sheetHost select,#sheetHost textarea").forEach(el=>{if(el.id&&!["turmaMod","kids","prof","meu","finProfF"].includes(el.dataset.change))keep[el.id]=el.type==="checkbox"?{c:el.checked}:{v:el.value}});
  const foc=document.activeElement&&document.activeElement.id;
  if(!TABS.includes(S.tab))S.tab=TABS[0];
  document.querySelectorAll("nav .tab").forEach(b=>{b.hidden=!TABS.includes(b.dataset.tab);b.setAttribute("aria-selected",String(b.dataset.tab===S.tab))});
  document.querySelector("nav.tabs").hidden=TABS.length<2;
  const nCom=S.mensagens.filter(m=>m.status==="novo").length+S.pedidos.filter(p=>p.status==="novo").length;const bc=document.getElementById("badgeCom");bc.hidden=!nCom;bc.textContent=nCom;
  const nC=paraContatar().length+vagasLiberadas().length+aniversariantes().filter(x=>x.dias===0).length+renovacoes().length;const bd=document.getElementById("badgeContatar");bd.hidden=!nC;bd.textContent=nC;
  document.getElementById("studioName").textContent=S.regras.nome||"SM|CT";
  const d=new Date();document.getElementById("todayLine").textContent=DIAS_LONGO[d.getDay()]+", "+d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"});
  const ready=Object.values(S.loaded).every(Boolean);
  if(!db){main.innerHTML=`<section class="view"><div class="card empty"><h3>Sem conexão com os dados</h3><span>Não foi possível ligar ao banco. Confira a internet e recarregue a página.</span></div></section>`}
  else if(!ready){main.innerHTML=`<section class="view"><div class="card empty">Carregando a agenda do estúdio…</div></section>`}
  else{const V={contatar:vContatar,agenda:vAgenda,alunos:vAlunos,aluno:vAluno,comunicacao:vComunicacao,professor:vProfessor,financeiro:vFinanceiro,ajustes:vAjustes}[S.tab]||vContatar;main.innerHTML=`<section class="view">${V()}</section>`}
  renderMonitor();
  const sh=document.getElementById("sheetHost");
  if(S.sheet){const html=S.sheet.render();if(html==null){S.sheet=null;sh.innerHTML=""}else sh.innerHTML=`<div class="sheet-bg" data-act="fecharFundo"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}else sh.innerHTML="";
  for(const id in keep){const el=document.getElementById(id);if(!el)continue;if("c" in keep[id])el.checked=keep[id].c;else if(el.tagName!=="SELECT"||[...el.options].some(o=>o.value===keep[id].v))el.value=keep[id].v}
  if(foc){const el=document.getElementById(foc);if(el&&el!==document.activeElement)el.focus({preventScroll:true})}
}

function abrirAluno(id){S.sheet={render:()=>{const a=aluno(id);if(!a)return null;return `<div class="row between"><h2>${esc(a.nome)}</h2><button class="small" data-act="fechar">Fechar</button></div>`+painelAluno(a,"staff")}};render()}

/* ---------- ações ---------- */
async function run(fn,ok){if(S.busy)return;S.busy=true;try{const r=await fn();if(ok)toast(typeof ok==="function"?ok(r):ok)}catch(e){console.error(e);toast(SMCT.mensagemErro(e)||"Não foi possível salvar. Tente de novo.")}finally{S.busy=false;render()}}
function R(id){return S.reservas.find(r=>r.id===id)}
function agendarFluxo(aid,tid,d,kids,staff){
  const a=aluno(aid),t=turma(tid);if(!a||!t)return;
  const fim=r=>r==="ja"?"Já está nessa aula":r&&r.precisa?"Os créditos mudaram, tente de novo":"Aula agendada";
  const c=classificar(a,tid,d);
  if(c.tipo!=="reposicao"){run(()=>criarReserva(aid,tid,d,"auto",kids),fim);return}
  const nome=a.nome.split(" ")[0];
  const bot=[];
  if(c.podeCredito)bot.push({label:"Usar 1 crédito de reposição",cls:"primary",run:()=>run(()=>criarReserva(aid,tid,d,"auto",kids,"credito"),fim)});
  else if(c.podeFerias)bot.push({label:"Usar 1 crédito de férias",cls:"primary",run:()=>run(()=>criarReserva(aid,tid,d,"auto",kids,"ferias"),fim)});
  if(staff)bot.push({label:"Agendar sem descontar",run:()=>run(()=>criarReserva(aid,tid,d,"auto",kids,"extra"),fim)});
  let txt=`<p><b>${esc(t.nome)}</b> ${relD(d)} às ${esc(t.hora)}.</p><p class="meta">Na semana desta aula ${esc(nome)} já tem ${aulasNaSemana(aid,d)} de ${vezes(a)} aulas do plano, então ela conta como reposição.</p>
  <div class="stats"><div class="stat"><div class="eyebrow">Créditos de reposição</div><b class="num">${c.cr}</b></div><div class="stat"><div class="eyebrow">Reposições no mês</div><b class="num">${c.usadas} de ${c.lim}</b></div><div class="stat"><div class="eyebrow">Créditos de férias</div><b class="num">${c.fe}</b></div></div>`;
  if(!c.podeCredito){
    const motivo=c.usadas>=c.lim?`O limite de ${c.lim} reposições do mês já foi usado.`:"Não há créditos de reposição.";
    txt+=`<p>${motivo} ${c.podeFerias?"Você pode usar um crédito de férias, se quiser.":"Também não há créditos de férias."}</p>`}
  if(!bot.length){confirmSheet("Reposição indisponível",txt+`<p class="meta">Fale com o estúdio se precisar de uma exceção.</p>`,[]);return}
  confirmSheet("Esta aula é uma reposição",txt,bot)}

function treinoValido(t){return !t.status||t.status==="validado"}
function treinoPara(aid,data){const L=treinosDe(aid).filter(treinoValido);return L.find(t=>t.data===data)||L.find(t=>t.data<=data)||null}

    h+=`</div></div>`}
  return h}
function profAlunoSheet(id){S.sheet={render:()=>{const a=aluno(id);if(!a)return null;const al=a.alerta||{};const hoje=ds(new Date());

/* ---------- financeiro ---------- */
const FAIXAS=[5,10,15,20,25,30];

function mesHoje(){return ds(new Date()).slice(0,7)}
function addMes(m,n){const [y,mm]=m.split("-").map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function nomeMes(m){const [y,mm]=m.split("-").map(Number);const t=new Date(y,mm-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return t.charAt(0).toUpperCase()+t.slice(1)}
function ultimoDia(m){const [y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()}

function ativoNoMes(a,m){if(a.ativo===false&&a.saidaEm&&a.saidaEm.slice(0,7)<m)return false;if(a.ativo===false&&!a.saidaEm)return false;return true}
function diaVenc(a){if(a.pagamento==="unico"&&a.vencUnico)return Number(a.vencUnico.slice(8));return Number(a.diaPagamento)||(a.inicio?Number(a.inicio.slice(8)):10)}
function cobranca(a,m){
  if(!Number(a.valor)||!ativoNoMes(a,m))return null;
  const unico=a.pagamento==="unico";
  if(unico){const ref=a.vencUnico||a.inicio||"";if(ref.slice(0,7)!==m)return null}
  else{if(a.inicio&&a.inicio>fimMes(m))return null;if(a.fim&&a.fim<m+"-01")return null}
  const dia=Math.min(diaVenc(a),ultimoDia(m));const venc=m+"-"+String(dia).padStart(2,"0");
  if(a.ativo===false&&a.saidaEm&&a.saidaEm.slice(0,7)===m&&a.saidaEm<=venc)return null;

function cobrancasMes(m){return S.alunos.map(a=>cobranca(a,m)).filter(Boolean).sort((x,y)=>x.venc.localeCompare(y.venc)||x.a.nome.localeCompare(y.a.nome))}
function vendasMes(m){return S.pedidos.filter(p=>p.status==="entregue"&&String(p.atualizadoEm||p.criadoEm).slice(0,7)===m)}
function contasMes(m){const out=[];for(const c of S.contas){
    if(c.recorrente){const ini=String(c.vencimento||"").slice(0,7);if(ini&&ini>m)continue;if(c.encerradaEm&&c.encerradaEm<m)continue;
      const dia=Math.min(Number(String(c.vencimento).slice(8))||1,ultimoDia(m));out.push({c,m,venc:m+"-"+String(dia).padStart(2,"0"),pagoEm:(c.pagos||{})[m]||null,valor:Number(((c.valores||{})[m])??c.valor)||0})}
    else if(String(c.vencimento||"").slice(0,7)===m)out.push({c,m,venc:c.vencimento,pagoEm:c.pagoEm||null,valor:Number(c.valor)||0})}

/* loja, eventos, materiais */
function pedPago(p){return p.pago!==false}
function custoPed(p){const pr=S.produtos.find(x=>x.id===p.produtoId);const cu=p.custoUnit!=null&&p.custoUnit!==""?Number(p.custoUnit):(Number(pr&&pr.custo)||0);return cu*(Number(p.qtd)||0)}
function vendidosProd(id){return S.pedidos.filter(p=>p.produtoId===id&&["novo","separado","entregue"].includes(p.status)).reduce((s,p)=>s+(Number(p.qtd)||0),0)}

function resumoMes(m){

  const sairam=S.alunos.filter(a=>a.ativo===false&&String(a.saidaEm||"").slice(0,7)===m);

  if(!P.length)h+=`<div class="item meta">Nenhum produto cadastrado.</div>`;

  return h}
function vEventos(){

/* ---------- comissões e aulas coletivas ---------- */
function slug(x){return normNome(x).normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x"}
function profsFin(){return [...new Set([...professores(),...S.comissoes.map(c=>String(c.professor||"").trim()).filter(Boolean)])].sort((x,y)=>x.localeCompare(y))}
function valorHora(){const v=Number((S.finCfg||{}).valorHora);return v>0?v:50}
function baseComissao(c,m){const a=c.alunoId&&aluno(c.alunoId);if(a&&!ativoNoMes(a,m))return{base:0};
  const v=Number(c.valor)||0;if(c.fim&&c.fim.slice(0,7)<m)return{base:0};if(!c.inicio)return{base:v};const im=c.inicio.slice(0,7);if(im>m)return{base:0};
  if(im<m)return{base:v};const dia=Number(c.inicio.slice(8)),dm=ultimoDia(m),dias=dm-dia+1;return{base:Math.round(v*dias/dm*100)/100,prop:dia>1,dias,dm}}
function comissoesDe(p,m){return S.comissoes.filter(c=>normNome(c.professor)===normNome(p)).map(c=>{const b=baseComissao(c,m);const pct=Number(c.pct)||0;return Object.assign({c,pct,valor:Math.round(b.base*pct)/100},b)}).sort((x,y)=>String(x.c.alunoNome).localeCompare(String(y.c.alunoNome)))}
function aulasDoc(p,m){return S.aulasProf.find(x=>x.id===slug(p)+"_"+m)||{removidas:[],extras:[]}}
function haAula(t){const d=Number(t.duracao)||50;return d>60?Math.round(d/60*2)/2:1}
function aulasColetivas(p,m){const ts=S.turmas.filter(t=>normNome(t.professor)===normNome(p)&&!ehStudio(t));const doc=aulasDoc(p,m);const rem=new Set(doc.removidas||[]);const hoje=ds(new Date());const out=[];
  for(let d=m+"-01";d<=fimMes(m);d=addDays(d,1))for(const t of ts)if((t.dias||[]).includes(wd(d))){const k=t.id+"|"+d;out.push({t,d,k,futura:d>hoje,dada:d<=hoje&&!rem.has(k),ha:haAula(t)})}
  return out.sort((x,y)=>x.d.localeCompare(y.d)||String(x.t.hora).localeCompare(String(y.t.hora)))}
function totalAulas(p,m){const all=aulasColetivas(p,m);const L=all.filter(x=>x.dada);const ex=aulasDoc(p,m).extras||[];const ha=L.reduce((s,x)=>s+x.ha,0)+ex.reduce((s,x)=>s+(Number(x.ha)||0),0);return{all,L,ex,ha,valor:Math.round(ha*valorHora()*100)/100}}
function totalProf(p,m){return comissoesDe(p,m).reduce((s,x)=>s+x.valor,0)+totalAulas(p,m).valor}
function totalProfs(m){return profsFin().reduce((s,p)=>s+totalProf(p,m),0)}
function painelComissoes(p,m,admin){
  const C=comissoesDe(p,m),A=totalAulas(p,m);const totC=C.reduce((s,x)=>s+x.valor,0);const sub=S.comSub||"comissoes";

    if(Object.keys(porDia).length)h+=`<div class="row">${[1,2,3,4,5,6,0].filter(d=>porDia[d]).map(d=>`<span class="pill p-neutral">${DIAS[d]} · ${porDia[d]} ${porDia[d]===1?"aula":"aulas"}</span>`).join("")}</div>`;
    h+=`<div class="list">${A.all.map(x=>`<div class="item"><span class="grow"><b>${cap(DIAS_LONGO[wd(x.d)])}</b> ${fmtFull(x.d)} · ${esc(x.t.hora)} ${esc(x.t.nome)}</span><span class="meta num">${fmtNum(x.ha)} h/a</span>${x.futura?`<span class="pill p-neutral">Prevista</span>`:admin?`<button class="small ${x.dada?"":"ghost"}" data-act="aulaToggle" data-prof="${esc(p)}" data-mes="${m}" data-k="${x.k}">${x.dada?"✓ Deu aula":"Não teve aula"}</button>`:x.dada?`<span class="pill p-ok">Deu aula</span>`:`<span class="pill p-neutral">Não teve</span>`}</div>`).join("")||`<div class="item meta">Nenhuma turma coletiva com este professor. Cadastre em Ajustes → Turmas.</div>`}</div>`;
    if(A.ex.length)h+=`<div class="eyebrow">Aulas extras</div><div class="list">${A.ex.map((x,i)=>`<div class="item"><span class="grow">${fmtFull(x.data)} · ${esc(x.desc||"Aula extra")}</span><span class="meta num">${fmtNum(x.ha)} h/a</span>${admin?`<button class="small ghost danger" data-act="aulaExtraRm" data-prof="${esc(p)}" data-mes="${m}" data-i="${i}">Remover</button>`:""}</div>`).join("")}</div>`;

    h+=`<div class="item"><b>Total</b><span class="meta num">${fmtNum(A.ha)} h/a</span><b class="num">${brl(A.valor)}</b></div></div>`;
    return h}
  h+=`<div class="card"><h3>Comissões por aluno</h3><div class="meta">No mês de início a mensalidade é proporcional aos dias restantes (ex.: começou dia 16 num mês de 31 dias = 16/31 da mensalidade). Nos meses seguintes, vale a mensalidade cheia.</div><div class="list">`;
  for(const x of C)h+=`<div class="item"><div class="grow"><div class="name">${esc(x.c.alunoNome)}</div><div class="meta">Início ${x.c.inicio?fmtFull(x.c.inicio):"—"} · mensalidade ${brl(x.c.valor)}${x.prop?` · proporcional ${x.dias}/${x.dm} dias = ${brl(x.base)}`:x.base?"":" · fora deste mês"}</div></div><span class="pill p-acc">${x.pct}%</span><span class="num" style="font-weight:600">${brl(x.valor)}</span>${admin?`<button class="small" data-act="editar" data-col="comissoes" data-id="${x.c.id}">Editar</button><button class="small ghost danger" data-act="rmDoc" data-col="comissoes" data-id="${x.c.id}">Remover</button>`:""}</div>`;

function promptIA(a,data,pedido){
  const hist=treinosDe(a.id).filter(treinoValido).slice(0,4);const al=alertaDe(a);

"""
${String(S.metodo.texto).slice(0,12000)}
"""

${hist.length?hist.map((t,i)=>`${i+1}) ${t.data} — ${t.titulo||"Treino"}\n${String(t.exercicios||"").trim()}${t.obs?"\nObs.: "+t.obs:""}`).join("\n\n"):"Nenhum. Monte um primeiro treino de avaliação conservador."}

${pedido?"PEDIDO DO PROFESSOR: "+pedido+"\n\n":""}TAREFA: proponha o treino de ${data}, como evolução coerente do treino anterior segundo a metodologia. Respeite alertas e relatos de dor: nesses casos, reduza carga ou substitua o exercício e diga isso na observação. Não faça diagnóstico.

{"titulo":"string curta","exercicios":["Exercício — séries x repetições/tempo — carga ou intensidade"],"obs":"orientações para o professor na aula","justificativa":"2 a 3 frases explicando o que mudou em relação ao treino anterior e por quê, citando a metodologia"}`}
async function gerarIA(aid){const a=aluno(aid);if(!a||!sampleNs||S.iaBusy)return;

    run(async()=>{await db.collection("contratos").add({alunoId:a.id,texto:p.txt,hash:h,versao:(S.contratoModelo&&S.contratoModelo.versao)||1,aceitoEm:new Date().toISOString(),aceitoPor:quem.nome,aceitoPorId:quem.id,aceitoPorResponsavel:quem.id!==a.id,planoNome:pl?pl.nome:"",dispositivo:String(navigator.userAgent||"").slice(0,200)})},"Contrato aceito e anexado ao cadastro")}
});

/* ---------- produtos: foto ---------- */
function fotoProduto(p,sz){const u=blobUrl(p.foto);
  return u?`<span class="plogo" style="width:${sz}px;height:${sz}px"><img src="${esc(u)}" alt="Foto de ${esc(p.nome)}" loading="lazy"></span>`:`<span class="plogo" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.3)}px" aria-hidden="true">SM</span>`}
document.addEventListener("change",async e=>{const pid=e.target.dataset&&e.target.dataset.fotoproduto;if(!pid||!assetsNs||!db)return;const file=e.target.files&&e.target.files[0];if(!file)return;
  const blob=await reduzirLogo(file);if(!blob){toast("Formato de foto não suportado. Use JPG ou PNG.");return}
  run(async()=>{const r=await assetsNs.upload(blob,{type:blob.type||"image/jpeg"});await db.doc("produtos/"+pid).update({foto:r.id})},"Foto do produto salva")});
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="rmFotoProduto"]');if(!b||!db)return;run(()=>db.doc("produtos/"+b.dataset.id).update({foto:""}),"Foto removida")});
/* ---------- parceiros: foto ---------- */
function logoParceiro(p,sz){const u=blobUrl(p.foto);const ini=String(p.nome||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
  return u?`<span class="plogo" style="width:${sz}px;height:${sz}px"><img src="${esc(u)}" alt="Logo de ${esc(p.nome)}" loading="lazy"></span>`:`<span class="plogo" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.34)}px" aria-hidden="true">${esc(ini)}</span>`}
async function reduzirLogo(file){try{const bmp=await createImageBitmap(file);const m=900,s=Math.min(1,m/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.88));if(b)return b}catch(e){}return reduzir(file)}
document.addEventListener("change",async e=>{const pid=e.target.dataset&&e.target.dataset.fotoparceiro;if(!pid||!assetsNs||!db)return;const file=e.target.files&&e.target.files[0];if(!file)return;
  const blob=await reduzirLogo(file);if(!blob){toast("Formato de foto não suportado. Use JPG ou PNG.");return}
  run(async()=>{const r=await assetsNs.upload(blob,{type:blob.type||"image/jpeg"});await db.doc("parceiros/"+pid).update({foto:r.id})},"Foto do parceiro salva")});
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="rmFotoParceiro"]');if(!b||!db)return;run(()=>db.doc("parceiros/"+b.dataset.id).update({foto:""}),"Foto removida")});
/* ---------- vagas extras num dia ---------- */
document.addEventListener("click",e=>{const b=e.target.closest('[data-act="vagaExtra"]');if(!b||!db||ROLE!=="admin")return;const t=turma(b.dataset.id);if(!t)return;
  const ex=Object.assign({},t.vagasExtra||{});const n=(Number(ex[S.dia])||0)+Number(b.dataset.v);if(vagasSemana(t,wd(S.dia))+n<0)return;if(n)ex[S.dia]=n;else delete ex[S.dia];
  for(const k of Object.keys(ex))if(k<addDays(ds(new Date()),-7))delete ex[k];
  run(()=>db.doc("turmas/"+t.id).update({vagasExtra:ex}),`${vagasDe(Object.assign({},t,{vagasExtra:ex}),S.dia)} vagas em ${fmtD(S.dia)}`)});
/* ---------- acessos (login) ---------- */
S.acessos=null;S.convites=null;S.codigoNovo=null;
async function carregarAcessos(){if(ROLE!=="admin")return;try{const [a,c]=await Promise.all([SMCT.rpc("listar_acessos"),SB.from("smct_convites").select("*").is("usado_por",null).order("criado_em",{ascending:false})]);
  if(c.error)throw c.error;S.acessos=a||[];S.convites=c.data||[];render()}catch(e){console.error(e);S.acessos=S.acessos||[];S.convites=S.convites||[];toast("Não foi possível carregar os acessos")}}
function linkApp(){return location.origin+location.pathname}
function msgConvite(cv){const nome=(cv.nome||"").split(" ")[0];return `Oi${nome?" "+nome:""}! Seu acesso ao app do ${S.regras.nome||"SM|CT"}: abra ${linkApp()} , toque em "Criar conta", use seu e-mail e uma senha, e digite o código ${cv.codigo}.`}
function cardAcessos(){
  if(S.acessos===null){setTimeout(carregarAcessos,0);return `<div class="card"><h2>Acessos</h2><div class="meta">Carregando…</div></div>`}
  const PAP={admin:"Administração",professor:"Professor",aluno:"Aluno"};
  const comAcesso=new Set(S.acessos.map(x=>x.aluno_id).filter(Boolean));
  const semAcesso=S.alunos.filter(a=>a.ativo!==false&&!comAcesso.has(a.id)).sort((x,y)=>x.nome.localeCompare(y.nome));
  let h=`<div class="card"><div class="row between"><h2>Acessos ao app</h2><button class="small ghost" data-act="acessosRecarregar">Atualizar</button></div>
  <div class="meta">Aluno com e-mail cadastrado entra sozinho: é só criar a conta com o mesmo e-mail. Para quem não tem e-mail no cadastro, para professores e para outra pessoa da administração, gere um código.</div>`;
  if(S.codigoNovo){const cv=S.codigoNovo;const a=cv.aluno_id&&aluno(cv.aluno_id);const wa=a&&waMsg(a,msgConvite(cv));
    h+=`<div class="note" style="display:grid;gap:8px"><div class="eyebrow">Código gerado · ${esc(PAP[cv.papel])}${cv.nome?" · "+esc(cv.nome):""}</div><div style="font:400 30px/1 var(--f-display);letter-spacing:.2em;user-select:all">${esc(cv.codigo)}</div><div class="meta" style="user-select:all">${esc(msgConvite(cv))}</div><div class="row">${wa?`<a class="btn small primary" href="${esc(wa)}" target="_blank" rel="noopener">Enviar no WhatsApp</a>`:""}<button class="small" data-act="copiarConvite">Copiar mensagem</button><button class="small ghost" data-act="fecharCodigo">Fechar</button></div></div>`}
  h+=`<form class="formgrid" data-form="conviteAluno"><label>Aluno<select id="cv_al"><option value="">Escolha o aluno</option>${semAcesso.map(a=>`<option value="${a.id}">${esc(a.nome)}${a.email?" · "+esc(a.email):""}</option>`).join("")}</select></label><div style="display:flex;align-items:end"><button class="small primary" style="width:100%">Gerar código do aluno</button></div></form>
  <form class="formgrid" data-form="conviteEquipe"><label>Nome<input id="cv_nome" list="cv_dl" placeholder="Igual ao nome nas turmas" required>${dl("cv_dl",professores())}</label><label>Papel<select id="cv_pap"><option value="professor">Professor</option><option value="admin">Administração</option></select></label><div style="display:flex;align-items:end"><button class="small" style="width:100%">Gerar código</button></div></form>`;
  if(S.convites.length)h+=`<details><summary>Códigos ainda não usados (${S.convites.length})</summary><div class="list" style="margin-top:6px">${S.convites.map(c=>`<div class="item"><span class="grow"><b class="num" style="letter-spacing:.12em">${esc(c.codigo)}</b> · ${esc(PAP[c.papel]||c.papel)}${c.nome?" · "+esc(c.nome):""}</span><button class="small" data-act="verCodigo" data-id="${esc(c.codigo)}">Mostrar</button><button class="small ghost danger" data-act="rmCodigo" data-id="${esc(c.codigo)}">Cancelar</button></div>`).join("")}</div></details>`;
  h+=`<div class="list">${S.acessos.map(x=>`<div class="item"><div class="grow"><div class="name">${esc(x.nome||x.email||"")}</div><div class="meta">${esc(x.email||"")}${x.aluno_id&&!aluno(x.aluno_id)?" · cadastro de aluno apagado":""}</div></div><span class="pill ${x.papel==="admin"?"p-acc":x.papel==="professor"?"p-ok":"p-neutral"}">${esc(PAP[x.papel]||x.papel)}</span>${x.user_id===SMCT.user.id?`<span class="meta">você</span>`:`<button class="small ghost danger" data-act="rmAcesso" data-id="${x.user_id}">Remover</button>`}</div>`).join("")||`<div class="item meta">Ninguém entrou ainda.</div>`}</div></div>`;
  return h}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||ROLE!=="admin")return;const act=b.dataset.act,id=b.dataset.id;
  if(act==="acessosRecarregar"){S.acessos=null;render()}
  if(act==="fecharCodigo"){S.codigoNovo=null;render()}
  if(act==="copiarConvite"&&S.codigoNovo){const t=msgConvite(S.codigoNovo);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Mensagem copiada"),()=>toast("Toque e segure a mensagem para copiar"))}
  if(act==="verCodigo"){const c=(S.convites||[]).find(x=>x.codigo===id);if(c){S.codigoNovo=c;render();window.scrollTo(0,0)}}
  if(act==="rmCodigo")run(async()=>{const {error}=await SB.from("smct_convites").delete().eq("codigo",id);if(error)throw error;if(S.codigoNovo&&S.codigoNovo.codigo===id)S.codigoNovo=null;await carregarAcessos()},"Código cancelado");
  if(act==="rmAcesso"){const x=(S.acessos||[]).find(y=>y.user_id===id);if(!x)return;confirmSheet("Remover acesso",`<p>${esc(x.nome||x.email)} deixa de entrar no app. O cadastro de aluno continua.</p>`,[{label:"Remover",cls:"primary",run:()=>run(async()=>{await SMCT.rpc("remover_acesso",{p_user:id});await carregarAcessos()},"Acesso removido")}])}
});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-form]");if(!f||ROLE!=="admin")return;const k=f.dataset.form;
  if(k==="conviteAluno"){e.preventDefault();const aid=(document.getElementById("cv_al")||{}).value;const a=aluno(aid);if(!a){toast("Escolha o aluno");return}
    run(async()=>{const c=await SMCT.rpc("criar_convite",{p_papel:"aluno",p_aluno:a.id,p_nome:a.nome});S.codigoNovo={codigo:c,papel:"aluno",aluno_id:a.id,nome:a.nome};await carregarAcessos();window.scrollTo(0,0)},"Código gerado")}
  if(k==="conviteEquipe"){e.preventDefault();const nome=((document.getElementById("cv_nome")||{}).value||"").trim(),pap=(document.getElementById("cv_pap")||{}).value||"professor";if(!nome){toast("Digite o nome");return}
    run(async()=>{const c=await SMCT.rpc("criar_convite",{p_papel:pap,p_aluno:null,p_nome:nome});S.codigoNovo={codigo:c,papel:pap,nome};document.getElementById("cv_nome").value="";await carregarAcessos()},"Código gerado")}
});

/* ---------- exemplos ---------- */
async function criarExemplos(){
  const t1=db.collection("turmas").doc(),t2=db.collection("turmas").doc(),t3=db.collection("turmas").doc();
  await t1.set({nome:"Pilates Solo (exemplo)",hora:"07:00",dias:[1,3,5],vagas:6,duracao:50,professor:"",exemplo:true});
  await t2.set({nome:"Pilates Aparelho (exemplo)",hora:"18:30",dias:[2,4],vagas:4,duracao:50,professor:"",exemplo:true});
  await t3.set({nome:"Aula aberta (exemplo)",hora:"09:00",dias:[6],vagas:8,duracao:60,professor:"",semCredito:true,exemplo:true});
  const hj=new Date();const niver="1990-"+String(hj.getMonth()+1).padStart(2,"0")+"-"+String(hj.getDate()).padStart(2,"0");
  const hoje=ds(new Date());
  const nomes=[["Aluna Exemplo A",[t1.id],niver,3,"trimestral",1],["Aluno Exemplo B",[t2.id],"",2,"anual",0],["Aluna Exemplo C",[t1.id],"",3,"semestral",2]];
  let mae=null;
  for(const [nome,fixos,nasc,vz,per,cr] of nomes){const r=db.collection("alunos").doc();await r.set({nome,telefone:"",nascimento:nasc,fixos,ferias:[],exemplo:true,vezesSemana:vz,reposicoesMes:3,periodo:per,inicio:hoje,fim:fimSugerido(hoje,per),pagamento:"mensal",diaPagamento:Number(hoje.slice(8)),criadoEm:new Date().toISOString()});
    if(cr)await mov(r.id,cr,"Créditos de reposição (exemplo)",null,"credito");if(nome.endsWith("C"))mae=r.id}
  const f=db.collection("alunos").doc();await f.set({nome:"Filho Exemplo C",telefone:"",nascimento:"2016-05-10",fixos:[t3.id],ferias:[],exemplo:true,responsavelId:mae,vezesSemana:1,reposicoesMes:3,periodo:"mensal",criadoEm:new Date().toISOString()})
}
async function apagarExemplos(){
  const as=S.alunos.filter(a=>a.exemplo).map(a=>a.id),ts=S.turmas.filter(t=>t.exemplo).map(t=>t.id);
  for(const r of S.reservas.filter(r=>as.includes(r.alunoId)||ts.includes(r.turmaId)))await db.doc("reservas/"+r.id).delete();
  for(const m of S.movs.filter(m=>as.includes(m.alunoId)))await db.doc("movimentos/"+m.id).delete();
  for(const x of S.espera.filter(x=>as.includes(x.alunoId)||ts.includes(x.turmaId)))await db.doc("espera/"+x.id).delete();
  for(const id of as)await db.doc("alunos/"+id).delete();
  for(const id of ts)await db.doc("turmas/"+id).delete();
}

/* ---------- conexão ---------- */
function setConn(ok,txt){const c=document.getElementById("conn");c.className="pill "+(ok?"p-ok":"p-bad");c.innerHTML=`<span class="dot"></span>${txt}`}
render();
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){setConn(false,"Sem conexão");render();return}
  setConn(true,"Ao vivo");
  window.claude.use("assets").then(x=>{assetsNs=x},()=>{assetsNs=null}).finally(()=>{assetsPronto=true;render()});
  const fail=e=>{console.error(e);setConn(false,"Conexão perdida")};
  const docs=snap=>snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));
  db.collection("alunos").onSnapshot(s=>{S.alunos=docs(s);S.loaded.alunos=true;render()},fail);
  db.collection("turmas").onSnapshot(s=>{S.turmas=docs(s).map(t=>Object.assign({dias:[]},t));S.loaded.turmas=true;render()},fail);
  db.collection("reservas").where("data",">=",addDays(ds(new Date()),-45)).onSnapshot(s=>{S.reservas=docs(s);S.loaded.reservas=true;render();setTimeout(()=>autoFixos(),1500)},fail);
  db.collection("espera").where("data",">=",addDays(ds(new Date()),-2)).onSnapshot(s=>{S.espera=docs(s);S.loaded.espera=true;render()},fail);
  db.collection("movimentos").onSnapshot(s=>{S.movs=docs(s);S.loaded.movs=true;render()},fail);
  const desde=new Date(Date.now()-120*864e5).toISOString();
  for(const [col,key,q] of [["avisos","avisos",null],["parceiros","parceiros",null],["produtos","produtos",null],["mensagens","mensagens",desde],["pedidos","pedidos",null]]){
    const ref=q?db.collection(col).where("criadoEm",">=",q):db.collection(col);ref.onSnapshot(s=>{S[key]=docs(s);render()},fail)}
  db.doc("config/metodologia").onSnapshot(s=>{S.metodo=s.exists?s.data():null;render()},fail);
  window.claude.use("sample").then(x=>{sampleNs=x;render()},()=>{});
  db.collection("treinos").onSnapshot(s=>{S.treinos=docs(s);render()},fail);
  db.collection("pagamentos").onSnapshot(s=>{S.pagamentos=docs(s);render()},fail);
  db.collection("contas").onSnapshot(s=>{S.contas=docs(s);render()},fail);
  for(const col of ["materiais","eventos","eventoItens","comissoes","aulasProf"])db.collection(col).onSnapshot(s=>{S[col]=docs(s);render()},fail);
  db.doc("config/financeiro").onSnapshot(s=>{S.finCfg=s.exists?s.data():{};render()},fail);
  db.collection("contratos").onSnapshot(s=>{S.contratos=docs(s);render()},fail);
  db.doc("config/contrato").onSnapshot(s=>{S.contratoModelo=s.exists?s.data():null;render()},fail);
  window.claude.use("downloads").then(x=>{downloadsNs=x;render()},()=>{});
  db.doc("config/planos").onSnapshot(s=>{if(s.exists){const d=s.data();S.cfg={modalidades:Array.isArray(d.modalidades)?d.modalidades:[],planos:Array.isArray(d.planos)?d.planos:[],cores:d.cores&&typeof d.cores==="object"?d.cores:{}}}render()},fail);
  db.doc("config/regras").onSnapshot(s=>{if(s.exists)S.regras=Object.assign({minutosDesmarcar:30,nome:""},s.data());S.regrasOk=true;render();setTimeout(()=>autoFixos(),1500)},fail);
  setInterval(()=>autoFixos(),10*60e3);
  if(ROLE==="aluno"){carregarOcupacao();carregarQuem();setInterval(()=>{carregarOcupacao();carregarQuem()},60000)}
  setInterval(()=>{if(!S.busy&&!document.querySelector("input:focus,select:focus"))render()},60000);
})();
};
