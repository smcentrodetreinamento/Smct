<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14120F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SM|CT Estúdio</title>

<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: app de uma coluna sobre o preto da marca SM|CT; dourado champanhe só no que importa; cada modalidade tem sua cor metálica */
:root{
  --bg:#F3EEE8;--surface:#FFFFFF;--sunk:#EBE4DB;--ink:#221C17;--muted:#6F655B;--line:#E2D8CC;
  --accent:#9C6C38;--accent-hi:#7A5126;--accent-ink:#2A1E12;--accent-soft:#F4E7D7;
  --warn:#94590A;--warn-soft:#FBEBD2;--bad:#B23A2E;--bad-soft:#F8E1DD;--good:#2F7A3B;--good-soft:#E1F0E2;
  --night:#14120F;--night-ink:#F3EAE0;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 6px 18px rgba(60,40,20,.06);
  --gold:linear-gradient(135deg,#F7D7B1 0%,#E2B78A 45%,#F3D3AE 70%,#C99B6E 100%);
  --f-display:"Josefin Sans","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"Jost","Futura","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 18px;margin-bottom:8px;background:var(--night);background-image:radial-gradient(120% 140% at 0% 0%,#2a241e 0%,var(--night) 60%);border-radius:10px;color:var(--night-ink)}
header.top .sub{color:#B9AC9E}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:40px;height:auto;flex:0 0 auto}
.brand .rule{width:1px;align-self:stretch;background:#E5BF94;opacity:.45}
h1{font:400 22px/1.1 var(--f-display);letter-spacing:.32em;text-transform:uppercase;margin:0;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.tagline{font:400 10.5px/1.3 var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:#E5BF94;opacity:.85;margin-top:5px}
h2{font:400 19px/1.25 var(--f-display);letter-spacing:.06em;margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 10px;margin-bottom:6px}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;min-height:38px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent-hi);box-shadow:inset 0 0 0 1px rgba(156,108,56,.35),var(--shadow)}
/* abas escuras com a aba ativa dourada */
.tabrow{background:#2A2A2C;border-color:#46464A;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.tabrow .tab{color:#F1EEEA}
.tabrow .tab:hover{color:#fff}
.tabrow .tab[aria-selected="true"]{background:var(--gold);color:#1A140E;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.35)}
/* Meu treino escuro */
.card.treino{background:#2A2A2C;border-color:#46464A;color:#F1EEEA}
.card.treino h3{color:#F1EEEA}
.card.treino .stat{background:#38383B}
.card.treino .eyebrow,.card.treino .meta{color:#C9C3BC}
.card.treino .saldo{color:#E5BF94}
.card.treino .pill.p-acc{background:var(--gold);color:#1A140E}
.card.treino .pill.p-neutral{background:#38383B;color:#C9C3BC}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:var(--surface);font-size:12px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
section.view{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.stack{display:grid;gap:8px}
.list{display:grid;gap:0}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.name{font-weight:600}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--good-soft);color:var(--good)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-neutral{background:var(--sunk);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
button,.btn{font:600 14px var(--f-body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
button:hover,.btn:hover{border-color:var(--muted)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--gold);border-color:#D9AE80;color:var(--accent-ink);letter-spacing:.02em}
.primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.danger{color:var(--bad)}
.small{min-height:32px;padding:5px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:40px;width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:40px}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;flex-direction:row;align-items:center;gap:4px;background:var(--sunk);padding:6px 10px;border-radius:8px;color:var(--ink);cursor:pointer}
.days input{width:auto;min-height:0}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:grid;justify-items:center;align-content:center;gap:4px;width:64px;height:76px;padding:0;border-radius:18px;border:0;background:var(--sunk);cursor:pointer;color:var(--muted);scroll-snap-align:start;position:relative}
.chip small{font:400 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:inherit}
.chip b{font:400 26px/1 var(--f-display);font-variant-numeric:tabular-nums;color:inherit}
.chip[aria-pressed="true"]{background:var(--night);color:#F7D7B1;box-shadow:0 6px 16px rgba(20,18,15,.25)}
.chip.vazio{opacity:.45}
.chip .pt{position:absolute;bottom:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.chip[aria-pressed="true"] .pt{background:#F7D7B1}
.time{font:400 22px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--accent-hi)}
.saldo{font:300 40px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent-hi)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.empty{color:var(--muted);text-align:left;padding:6px 0;display:grid;gap:8px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px}
.why{border-left:3px solid var(--warn);padding-left:10px}
.why.bad{border-color:var(--bad)}
.contact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.phone{font-variant-numeric:tabular-nums;user-select:all;color:var(--muted);font-size:13px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{display:grid;gap:2px;align-content:start;background:var(--sunk);border-radius:12px;padding:10px 12px}
.mod{--m:var(--accent)}
.aula{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 12px 12px 14px;border:1px solid var(--line);border-left:3px solid var(--m);border-radius:8px;background:var(--surface)}
.aula .hora{font:400 20px/1 var(--f-display);letter-spacing:.04em;color:var(--m);font-variant-numeric:tabular-nums;min-width:56px}
.aula .info{min-width:0;display:grid;gap:2px}
.aula .act{grid-column:3;grid-row:1/span 2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:480px){.aula{grid-template-columns:auto 1fr}.aula .act{grid-column:1/-1;grid-row:auto;justify-content:flex-start}}
.modtag{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.modtag::before{content:"";width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--m)}
.prof{color:var(--muted);font-size:13px}
.prof b{color:var(--ink);font-weight:500}
.diahead{font:400 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);padding-top:6px;display:flex;align-items:center;gap:10px}
.diahead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(229,191,148,.4),transparent)}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;min-height:0}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
details.plano>summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink);font-weight:400}
details.plano>summary::-webkit-details-marker{display:none}
.chev{width:10px;height:10px;border-right:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);transform:rotate(45deg);margin:0 4px 4px;flex:0 0 auto;transition:transform .2s}
details.plano[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
details.plano>summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.agd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0 12px 12px;border-top:1px solid var(--line);border-left:3px solid var(--m);margin-top:-1px}
.agd:first-child{border-top:0}
.agd-l{display:grid;gap:2px;min-width:0;flex:1 1 180px}
.agd-dia{font:600 12px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--m);display:flex;gap:8px;align-items:baseline}
.agd-dia small{font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.agd-txt{font-size:16px}
.agd-txt b{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.agd-r{display:flex;gap:6px;align-items:flex-start}
details.mini>summary{list-style:none;cursor:pointer;min-height:32px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;font-weight:700;color:var(--muted)}
details.mini>summary::-webkit-details-marker{display:none}
.av{border-radius:50%;object-fit:cover;background:var(--sunk);display:inline-grid;place-items:center;flex:0 0 auto;font:400 18px var(--f-display);letter-spacing:.06em;color:var(--accent-hi);border:1px solid var(--line);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.flag{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto;box-shadow:0 0 0 3px var(--surface)}
.flag.dor{background:#D2463A}.flag.atencao{background:#E3A21A}
.fotolink{font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.monitor{position:fixed;inset:0;z-index:40;background:#100E0C;color:#F3EAE0;display:grid;grid-template-rows:auto 1fr auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));gap:14px;font-family:var(--f-body)}
.monitor .mh{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.monitor .mh .t{font:300 clamp(28px,4vw,52px)/1 var(--f-display);letter-spacing:.06em;color:#F7D7B1}
.monitor .mh .n{font:400 clamp(16px,2vw,26px)/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.monitor .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;min-height:0}
@media (max-width:800px){.monitor .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;overflow:auto}}
@media (max-width:480px){.monitor .grid{grid-template-columns:1fr}}
.mc{background:#1B1815;border:1px solid #2F2A25;border-top:3px solid var(--m,#E5BF94);border-radius:12px;padding:14px;display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0;overflow:hidden}
.mc .who{display:flex;align-items:center;gap:12px;min-width:0}
.mc .who .av{border-color:#3a332c;background:#26221e;color:#F7D7B1}
.mc .nm{font:400 clamp(17px,1.8vw,24px)/1.15 var(--f-display);letter-spacing:.04em}
.mc .al{font-size:clamp(12px,1.2vw,15px);font-weight:600;display:flex;gap:6px;align-items:center;margin-top:3px}
.mc .al.dor{color:#FF8C7F}.mc .al.atencao{color:#F5C15A}
.mc .tr{overflow:auto;min-height:0;font-size:clamp(14px,1.35vw,19px);line-height:1.45}
.mc .tr h4{margin:0 0 6px;font:500 clamp(12px,1.1vw,14px)/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#C9B8A5}
.mc .tr ol{margin:0;padding-left:1.3em}
.mc .tr .ob{margin-top:8px;color:#E9D4BC;font-style:italic}
.mc .flag{box-shadow:0 0 0 3px #1B1815}
.monitor .mf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#A89D91;font-size:13px}
.monitor button{background:#26221e;color:#F3EAE0;border-color:#3a332c}
/* temas por plano: o card redefine os tokens localmente */
.plano.pl-black{--ink:#F3EAE0;--muted:#C9B8A5;--line:#3a332c;--accent:#E5BF94;--accent-hi:#F7D7B1;--accent-soft:#2a241e;--sunk:#221e1a;--good:#9BCF9E;--good-soft:#1D2E1F;--warn:#E9B25E;--warn-soft:#382A16;--bad:#EE8F82;--bad-soft:#3A1F1B;
  background:#14120F;background-image:radial-gradient(130% 120% at 0% 0%,#2b241d 0%,#14120F 55%);border:1px solid #C99B6E;color:var(--ink)}
.plano.pl-black h2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.plano.pl-basic{--ink:#2A1E12;--muted:#6B4F2E;--line:#D9AE80;--accent:#7A5126;--accent-hi:#5E3D1A;--accent-soft:#F6E2C6;--sunk:#F3DDBF;
  background:linear-gradient(135deg,#FBEBD3 0%,#EFCFA6 55%,#F7DFBE 100%);border:1px solid #D2A06C;color:var(--ink)}
.plano.pl-space{--ink:#F1F3F6;--muted:#C3C8D0;--line:#5D626A;--accent:#D5DAE2;--accent-hi:#FFFFFF;--accent-soft:#3c4047;--sunk:#363A40;--good:#A8D8AE;--good-soft:#25332A;--warn:#EBC172;--warn-soft:#40351F;--bad:#F29A8E;--bad-soft:#42282A;
  background:linear-gradient(135deg,#4A4E55 0%,#2E3136 60%,#3B3F45 100%);border:1px solid #A9AEB7;color:var(--ink)}
.plano.pl-space h2{background:linear-gradient(135deg,#FFFFFF 0%,#C9CED6 45%,#F4F6F9 70%,#9EA4AD 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.plano.pl-promo{--ink:#FFF6EC;--muted:#F5DCC2;--line:#C98A55;--accent:#FFE2C2;--accent-hi:#FFFFFF;--accent-soft:#8A5428;--sunk:#9A5F2F;--good:#E6F5E1;--good-soft:#5D6B2E;--warn:#FFE3A8;--warn-soft:#7A4A12;--bad:#FFD3CC;--bad-soft:#7A2E22;
  background:linear-gradient(135deg,#C2824A 0%,#9A5F2F 55%,#B57440 100%);border:1px solid #7A4A22;color:var(--ink)}
/* SM|STANDARD prata · FULL PASS dourado · MOVIMENT bronze (letras pretas) */
.plano.pl-standard{--ink:#0E0E0E;--muted:#1F2226;--line:#5C6168;--accent:#1A1A1A;--accent-hi:#000;--accent-soft:#E4E7EB;--sunk:#D9DDE2;
  background:linear-gradient(135deg,#B9BEC5 0%,#868C94 45%,#AEB3BA 70%,#6B7078 100%);border:1px solid #5C6168;color:var(--ink)}
.plano.pl-full{--ink:#0E0E0E;--muted:#4A3A1E;--line:#B8924F;--accent:#1A1A1A;--accent-hi:#000;--accent-soft:#F6E6C4;--sunk:#EBD3A2;
  background:linear-gradient(135deg,#F9E3B0 0%,#D9AE5C 45%,#F3D597 70%,#B88A3C 100%);border:1px solid #A67C34;color:var(--ink)}
.plano.pl-moviment{--ink:#0E0E0E;--muted:#4A2E18;--line:#A86E43;--accent:#1A1A1A;--accent-hi:#000;--accent-soft:#F0D3B8;--sunk:#E2B993;
  background:linear-gradient(135deg,#E8B489 0%,#B87A4B 45%,#DDA174 70%,#94603A 100%);border:1px solid #84552F;color:var(--ink)}
.plano.pl-standard h2,.plano.pl-full h2,.plano.pl-moviment h2{color:#0E0E0E}
.plano[class*="pl-"] .note{background:var(--accent-soft);color:var(--ink)}
.plano[class*="pl-"] .chev{border-color:var(--accent)}
/* área do aluno: identidade grafite + dourado */
.area-aluno .card:not([class*="pl-"]),.area-aluno .aula,.card.ola,.card.treino,details.agds{
  --surface:#2A2A2C;--sunk:#38383B;--ink:#F1EEEA;--muted:#C9C3BC;--line:#46464A;--accent:#E5BF94;--accent-hi:#F7D7B1;--accent-soft:#3A3226;
  --warn:#E9B25E;--warn-soft:#3A2E18;--good:#9BCF9E;--good-soft:#1D2E1F;--bad:#EE8F82;--bad-soft:#3A1F1B;
  background:#2A2A2C;border-color:#46464A;color:var(--ink)}
.area-aluno{display:grid;gap:14px}
.area-aluno .card:not([class*="pl-"]) h2,.area-aluno .card:not([class*="pl-"]) h3,.card.ola h2{color:#F1EEEA}
.area-aluno details.ferias .pill.p-acc,.area-aluno details.agds .pill.p-acc{background:var(--gold);color:#1A140E}
.card.ola .av{background:#38383B;color:#E5BF94;border-color:#55555A}
.area-aluno .aula{border-left:3px solid #D9AE80}
.area-aluno .aula .hora{color:#E5BF94}
.area-aluno .aula .name,.area-aluno .aula .meta b{color:#F1EEEA}
.area-aluno .aula .meta{color:#C9C3BC}
.area-aluno .modtag{color:#E5BF94}
.area-aluno .chip{background:#38383B;color:#C9C3BC}
.area-aluno .chip[aria-pressed="true"]{background:var(--gold);color:#1A140E}
.area-aluno .chip[aria-pressed="true"] .pt{background:#1A140E}
.area-aluno input,.area-aluno select,.area-aluno textarea{background:#38383B;color:#F1EEEA;border-color:#55555A}
.area-aluno .card button:not(.primary):not(.danger):not([data-act]):not(.espera-btn){background:#38383B;color:#F1EEEA;border-color:#55555A}
details.agds>summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
.area-aluno [data-act="agendar"],.area-aluno [data-act="pegarVaga"]{background:#4B5D2A;border:1.5px solid #D9AE80;color:#fff}
.area-aluno [data-act="agendar"]:hover,.area-aluno [data-act="pegarVaga"]:hover{background:#3C4B21;filter:none}
.area-aluno [data-act="desmarcarAluno"]{background:#6E1A2A;border:1.5px solid #D9AE80;color:#fff}
.area-aluno [data-act="desmarcarAluno"]:hover{background:#561421}
/* lista de espera em destaque: dourado com preto */
.area-aluno .card.espera{--ink:#111;--muted:#2A1E12;--line:#B88A3C;
  background:linear-gradient(135deg,#F7D7B1 0%,#E2B78A 45%,#F3D3AE 70%,#C99B6E 100%);border:2px solid #1A140E;box-shadow:0 0 0 4px rgba(217,174,128,.25),var(--shadow);color:#111}
.area-aluno .card.espera h3{color:#111;font-size:20px;margin:0}
.card.espera .eyebrow{color:#3A2A14}
.area-aluno .card.espera .meta{color:#2A1E12}
.espera-top{display:flex;align-items:center;gap:12px}
.espera-ic{width:42px;height:42px;border-radius:50%;background:#111;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.espera-n{background:#111;color:#F7D7B1}
.area-aluno .card.espera select{background:#fff;color:#111;border-color:#1A140E}
.espera-btn{background:#111;border-color:#111;color:#F7D7B1}
.espera-btn:hover{background:#000}
.area-aluno .card.espera .pill.p-wait{background:#111;color:#F7D7B1}
.area-aluno .card.espera .danger{color:#7A1626}
.area-aluno .ferias input[type=date]{-webkit-appearance:none;appearance:none;max-width:100%;min-height:44px;display:block}
/* quem vai */
details.quem{margin-top:6px}
details.quem>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:600 13px var(--f-body);color:#E5BF94;padding:4px 10px;border:1px solid #6A5A44;border-radius:999px;background:rgba(229,191,148,.08)}
details.quem>summary::-webkit-details-marker{display:none}
details.quem>summary .chev{width:7px;height:7px;margin:0 2px 3px;border-color:#E5BF94}
details.quem:not([open])>summary .chev{transform:rotate(45deg);margin:0 2px 3px}
details.quem[open]>summary .chev{transform:rotate(-135deg);margin-bottom:-3px}
.quem-l{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.quem-n{font-size:13px;padding:3px 10px;border-radius:999px;background:#38383B;color:#F1EEEA;border:1px solid #55555A}
/* férias em blocos de 5 dias */
.blocos{display:flex;gap:6px;flex-wrap:wrap}
.bloco{flex:1 1 40px;text-align:center;padding:6px 0;border-radius:8px;font:600 12px var(--f-body);background:var(--good-soft);color:var(--good);border:1px solid #BFDDC2}
.bloco.usado{background:var(--sunk);color:var(--muted);border-color:var(--line);text-decoration:line-through}
/* loja: foto do produto */
.prod{overflow:hidden}
.prod-img{margin:-14px -14px 4px;aspect-ratio:4/3;background:var(--sunk)}
.prod-img img{width:100%;height:100%;object-fit:cover;display:block}
.busca{position:relative;display:flex;align-items:center}
.busca svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.busca input{padding-left:36px;min-height:38px;font-size:15px}
.diafx{min-height:30px;min-width:40px;padding:2px 8px;font:600 12px var(--f-body);border-radius:8px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.diafx[aria-pressed="true"]{background:var(--night);color:#F7D7B1;border-color:var(--night)}
.hist{font-size:13px}
.hist .item{padding:7px 0}
.plus{color:var(--good);font-weight:700}.minus{color:var(--bad);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:92px;height:92px;border-radius:12px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);padding:0;display:grid;place-items:center;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;min-height:24px;width:24px;padding:0;border-radius:50%;font-size:14px}
.thumb.add{border-style:dashed;color:var(--accent);font-size:12.5px;font-weight:600;text-align:center;padding:6px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details summary{cursor:pointer;font-weight:600;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

/* login e cabeçalho */
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hdr-r .sub{color:#B9AC9E;font-size:12.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-sair{background:#26221e;color:#F3EAE0;border-color:#3a332c;min-height:32px;padding:5px 12px;font-size:13px}
#auth{position:fixed;inset:0;z-index:50;background:#100E0C;background-image:radial-gradient(120% 90% at 0% 0%,#2a241e 0%,#100E0C 60%);color:#F3EAE0;overflow:auto;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#auth[hidden]{display:none!important}
.auth-box{width:100%;max-width:400px;display:grid;gap:22px}
.auth-brand{display:flex;align-items:center;gap:14px}
.auth-mark{font:400 26px/1 var(--f-display);letter-spacing:.32em;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-tag{font:400 10.5px/1.3 var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:#E5BF94;opacity:.85;margin-top:6px}
#auth form,#auth .stack{display:grid;gap:12px;background:#1B1815;border:1px solid #2F2A25;border-radius:12px;padding:18px}
#auth h2{color:#F7D7B1}
#auth label{color:#C9B8A5}
#auth input{background:#26221e;color:#F3EAE0;border-color:#3a332c}
#auth .meta{color:#B9AC9E}
#auth .ghost{color:#E5BF94;padding:0 2px;min-height:0;font-weight:600}
.auth-msg{font-size:13.5px;color:#C9B8A5;min-height:1em}
.auth-msg.ruim{color:#FF8C7F}
.plogo{border-radius:12px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);display:inline-grid;place-items:center;flex:0 0 auto;font:400 18px var(--f-display);letter-spacing:.06em;color:var(--accent-hi)}
.plogo img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
</style>
</head>

  ferias_ja_comecaram:"Essas férias já começaram. Fale com o estúdio.",pedido_em_andamento:"Esse pedido já está sendo separado.",produto_indisponivel:"Produto indisponível.",
  sem_permissao:"Seu acesso não permite essa ação.",codigo_invalido:"Código inválido ou já usado.",nao_pode_remover_a_si:"Você não pode remover o seu próprio acesso.",
  precisa_credito:"Os créditos mudaram. Tente de novo."};
function codigoErro(e){const m=String((e&&(e.message||e.msg||e.error_description))||e||"");for(const k in ERROS)if(m.includes(k))return k;return null}
SMCT.mensagemErro=e=>{const k=codigoErro(e);return k?ERROS[k]:null};
SMCT.codigoErro=codigoErro;
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;return data}
SMCT.rpc=rpc;

/* ---------- camada de dados (mesma forma da versão do Claude) ---------- */
const LIS=new Set();            // ouvintes ativos
function rowOk(l,col,id,data){if(l.col!==col)return false;if(l.id)return l.id===id;if(l.filt){const v=data&&data[l.filt.f];return v!=null&&String(v)>=String(l.filt.v)}return true}
function emitir(l){clearTimeout(l.t);l.t=setTimeout(()=>{try{l.cb(l.id?docSnap(l.map.get(l.id)):colSnap(l.map))}catch(e){console.error(e)}},40)}
function colSnap(map){return{docs:[...map.values()].map(r=>({id:r.id,exists:true,data:()=>r.data}))}}
function docSnap(r){return r?{id:r.id,exists:true,data:()=>r.data}:{exists:false,data:()=>undefined}}
function aplicar(col,id,data){for(const l of LIS){if(l.col!==col)continue;
  if(data&&rowOk(l,col,id,data))l.map.set(id,{id,data});else l.map.delete(id);emitir(l)}}
async function buscar(l){
  if(l.id){const {data,error}=await sb.from("docs").select("id,data").eq("col",l.col).eq("id",l.id).maybeSingle();if(error)throw error;l.map=new Map(data?[[data.id,data]]:[]);return}
  const out=new Map();let de=0;const P=1000;
  for(;;){let q=sb.from("docs").select("id,data").eq("col",l.col);if(l.filt)q=q.gte("data->>"+l.filt.f,String(l.filt.v));
    const {data,error}=await q.order("id").range(de,de+P-1);if(error)throw error;for(const r of data)out.set(r.id,r);if(data.length<P)break;de+=P}
  l.map=out}
function ouvir(l){LIS.add(l);buscar(l).then(()=>emitir(l),e=>{console.error(e);l.err&&l.err(e)});return()=>LIS.delete(l)}
SMCT.recarregar=async cols=>{const L=[...LIS].filter(l=>!cols||cols.includes(l.col));await Promise.all(L.map(l=>buscar(l).then(()=>emitir(l)).catch(e=>console.error(e))))};

async function lerDoc(col,id){const {data,error}=await sb.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();if(error)throw error;return data?data.data:null}
function docRef(col,id){return{id,
  async set(d){const data=JSON.parse(JSON.stringify(d));const {error}=await sb.from("docs").upsert({col,id,data,updated_at:new Date().toISOString()},{onConflict:"col,id"});if(error)throw error;aplicar(col,id,data)},
  async update(p){const cur=await lerDoc(col,id);if(!cur){if(col==="config")return this.set(p);throw new Error("doc_inexistente")}const data=Object.assign({},cur,JSON.parse(JSON.stringify(p)));
    const {data:r,error}=await sb.from("docs").update({data,updated_at:new Date().toISOString()}).eq("col",col).eq("id",id).select("id");if(error)throw error;if(!r||!r.length)throw new Error("sem_permissao");aplicar(col,id,data)},
  async delete(){const {error}=await sb.from("docs").delete().eq("col",col).eq("id",id);if(error)throw error;aplicar(col,id,null)},
  async acquire(o){try{const ok=await rpc("doc_acquire",{p_chave:col+"/"+id,p_holder:o.holder,p_ttl_ms:o.ttlMs||60000});return{acquired:!!ok}}catch(e){return{acquired:false}}},
  onSnapshot(cb,err){return ouvir({col,id,cb,err,map:new Map()})}}}
function colRef(col,filt){return{
  doc(id){return docRef(col,id||genId())},
  async add(d){const r=docRef(col,genId());await r.set(d);return r},
  where(f,op,v){return colRef(col,{f,v})},
  onSnapshot(cb,err){return ouvir({col,filt,cb,err,map:new Map()})}}}
const DB={collection:col=>colRef(col),doc:path=>{const i=path.indexOf("/");return docRef(path.slice(0,i),path.slice(i+1))}};

/* ao vivo */
let canal=null;
function ligarAoVivo(){if(canal)return;
  canal=sb.channel("smct-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.col)return;aplicar(row.col,row.id,p.eventType==="DELETE"?null:row.data)}).subscribe()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&SMCT.iniciado)SMCT.recarregar()});
setInterval(()=>{if(document.visibilityState==="visible"&&SMCT.iniciado)SMCT.recarregar()},180000);

/* fotos */
const ASSETS={async upload(blob,o){const ext=(o&&o.type||blob.type||"image/jpeg").includes("png")?"png":"jpg";
  const path=SMCT.user.id+"/"+Date.now().toString(36)+"-"+genId().slice(0,6)+"."+ext;
  const {error}=await sb.storage.from("fotos").upload(path,blob,{contentType:(o&&o.type)||blob.type||"image/jpeg",upsert:false});if(error)throw error;
  return{id:sb.storage.from("fotos").getPublicUrl(path).data.publicUrl}}};
SMCT.fotoUrl=id=>/^https?:\/\//.test(String(id||""))?String(id):"";

/* downloads */
const DOWNLOADS={async save(o){const u=URL.createObjectURL(o.data);const a=document.createElement("a");a.href=u;a.download=o.filename||"arquivo";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};

window.claude={use:async n=>{if(n==="db")return DB;if(n==="assets")return ASSETS;if(n==="downloads")return DOWNLOADS;throw{code:"not_granted"}}};

/* ---------- login ---------- */
function telaAuth(html){const el=$("#auth");el.hidden=false;el.innerHTML=`<div class="auth-box"><div class="auth-brand"><img src="${$(".brand img").src}" alt="" width="46" height="66"><div><div class="auth-mark">SM|CT</div><div class="auth-tag">Lugar que acolhe, desafia e transforma</div></div></div>${html}</div>`}
function avisoAuth(t,ruim){const m=$("#authMsg");if(m){m.textContent=t;m.className="auth-msg"+(ruim?" ruim":"")}}
function erroAuth(e){const m=String(e&&e.message||e);
  if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";if(/already registered|already been registered/i.test(m))return"Este e-mail já tem conta. Use Entrar.";
  if(/Email not confirmed/i.test(m))return"Confirme seu e-mail pelo link que enviamos antes de entrar.";if(/Password should be/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  return SMCT.mensagemErro(e)||"Não deu certo. Confira os dados e tente de novo."}
function formEntrar(modo){const cad=modo==="cadastro";
  telaAuth(`<form id="fAuth" class="stack" novalidate><h2>${cad?"Criar conta":"Entrar"}</h2>
  <label>E-mail<input id="aEmail" type="email" autocomplete="email" inputmode="email" required></label>
  <label>Senha<input id="aSenha" type="password" autocomplete="${cad?"new-password":"current-password"}" minlength="6" required></label>
  ${cad?`<label>Código de acesso (se recebeu do estúdio)<input id="aCod" autocomplete="off" autocapitalize="characters" placeholder="Ex.: K7M2QX"></label>`:""}
  <button class="primary" type="submit">${cad?"Criar conta":"Entrar"}</button>
  <div id="authMsg" class="auth-msg"></div>
  <div class="meta">${cad?`Já tem conta? <button type="button" class="ghost" data-auth="entrar">Entrar</button>`:`Primeira vez? <button type="button" class="ghost" data-auth="cadastro">Criar conta</button> · <button type="button" class="ghost" data-auth="senha">Esqueci a senha</button>`}</div>
  ${cad?`<div class="meta">Use o mesmo e-mail cadastrado no estúdio. Se o estúdio te mandou um código, digite acima.</div>`:""}</form>`);
  $("#fAuth").onsubmit=async e=>{e.preventDefault();const email=$("#aEmail").value.trim(),senha=$("#aSenha").value;
    if(!email||senha.length<6){avisoAuth("Preencha o e-mail e uma senha com pelo menos 6 caracteres.",true);return}
    const btn=e.submitter||$("#fAuth button[type=submit]");btn.disabled=true;avisoAuth(cad?"Criando sua conta…":"Entrando…");
    try{if(cad){const cod=($("#aCod").value||"").trim().toUpperCase();try{if(cod)localStorage.setItem("smct_codigo",cod)}catch(_){}
        const {data,error}=await sb.auth.signUp({email,password:senha,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(!data.session){avisoAuth("Conta criada. Abra o link que enviamos para o seu e-mail e depois entre aqui.");btn.disabled=false;return}}
      else{const {error}=await sb.auth.signInWithPassword({email,password:senha});if(error)throw error}
      await iniciar()}
    catch(err){console.error(err);avisoAuth(erroAuth(err),true);btn.disabled=false}}}
function formSenha(){telaAuth(`<form id="fSenha" class="stack"><h2>Recuperar senha</h2><label>E-mail<input id="sEmail" type="email" required></label><button class="primary">Enviar link</button><div id="authMsg" class="auth-msg"></div><div class="meta"><button type="button" class="ghost" data-auth="entrar">Voltar</button></div></form>`);
  $("#fSenha").onsubmit=async e=>{e.preventDefault();const email=$("#sEmail").value.trim();if(!email)return;
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});avisoAuth(error?erroAuth(error):"Se o e-mail tiver conta, chega um link para criar uma nova senha.",!!error)}}
function formNovaSenha(){telaAuth(`<form id="fNova" class="stack"><h2>Nova senha</h2><label>Nova senha<input id="nSenha" type="password" minlength="6" autocomplete="new-password" required></label><button class="primary">Salvar senha</button><div id="authMsg" class="auth-msg"></div></form>`);
  $("#fNova").onsubmit=async e=>{e.preventDefault();const p=$("#nSenha").value;if(p.length<6){avisoAuth("Pelo menos 6 caracteres.",true);return}
    const {error}=await sb.auth.updateUser({password:p});if(error){avisoAuth(erroAuth(error),true);return}await iniciar()}}
function formCodigo(email,msg){telaAuth(`<form id="fCod" class="stack"><h2>Quase lá</h2><div class="meta">Você entrou como <b>${escH(email)}</b>, mas este e-mail ainda não está ligado a um cadastro do estúdio. Digite o código de acesso que o estúdio te enviou.</div>
  <label>Código de acesso<input id="cCod" autocomplete="off" autocapitalize="characters" placeholder="Ex.: K7M2QX" required></label><button class="primary">Continuar</button><div id="authMsg" class="auth-msg${msg?" ruim":""}">${escH(msg||"")}</div>
  <div class="meta">Não tem código? Peça na recepção ou confira se usou o mesmo e-mail do seu cadastro. <button type="button" class="ghost" data-auth="sair">Sair</button></div></form>`);
  $("#fCod").onsubmit=async e=>{e.preventDefault();const c=$("#cCod").value.trim().toUpperCase();if(!c)return;
    try{const p=await rpc("vincular_conta",{p_codigo:c});if(p&&p.papel){entrarApp(p)}else formCodigo(email,"Código não reconhecido.")}catch(err){formCodigo(email,erroAuth(err))}}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-auth]");if(!b)return;const m=b.dataset.auth;
  if(m==="sair"){sair();return}if(m==="senha")formSenha();else formEntrar(m)});
async function sair(){try{await sb.auth.signOut()}catch(_){}location.reload()}
SMCT.sair=sair;

async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){formEntrar("entrar");return}
  SMCT.user=session.user;
  telaAuth(`<div class="meta">Carregando seu acesso…</div>`);
  let cod=null;try{cod=localStorage.getItem("smct_codigo")}catch(_){}
  let p;try{p=await rpc("vincular_conta",{p_codigo:cod||null});try{localStorage.removeItem("smct_codigo")}catch(_){}}
  catch(err){console.error(err);try{localStorage.removeItem("smct_codigo")}catch(_){}
    if(codigoErro(err)==="codigo_invalido"){formCodigo(session.user.email,"O código digitado não foi aceito.");return}
    telaAuth(`<div class="stack"><h2>Não foi possível entrar</h2><div class="meta">${escH(String(err&&err.message||err))}</div><div class="meta">Se o banco ainda não foi configurado, rode as Partes 1 a 12 no Supabase.</div><button class="primary" data-auth="sair">Sair</button></div>`);return}
  if(!p||!p.papel){formCodigo(session.user.email);return}
  entrarApp(p)}
function entrarApp(p){
  if(SMCT.iniciado)return;
  SMCT.perfil=p;SMCT.papel=p.papel;SMCT.iniciado=true;
  $("#auth").hidden=true;$("#auth").innerHTML="";
  document.body.dataset.papel=p.papel;
  const who=$("#quem");if(who)who.textContent=(p.nome||SMCT.user.email||"")+" · "+({admin:"Administração",professor:"Professor",aluno:"Aluno"}[p.papel]||"");
  ligarAoVivo();
  window.SMCT_APP();
}
sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")formNovaSenha();if(ev==="SIGNED_OUT"&&SMCT.iniciado)location.reload()});
window.addEventListener("DOMContentLoaded",()=>{if(/type=recovery/.test(location.hash))return;iniciar()});
})();

</script>
<script>
window.SMCT_APP=function(){
const SMCT=window.SMCT,ROLE=SMCT.papel,PERFIL=SMCT.perfil||{},SB=SMCT.sb;
const TABS_ROLE={admin:["contatar","agenda","alunos","aluno","professor","comunicacao","financeiro","ajustes"],professor:["contatar","agenda","alunos","professor"],aluno:["aluno"]};
const TABS=TABS_ROLE[ROLE]||["aluno"];
function blobUrl(id){return SMCT.fotoUrl(id)}
/* vagas: padrão da turma, ou vagas do dia da semana, mais vagas extras daquela data */
function vagasSemana(t,w){if(!t)return 0;const vd=t.vagasDia||{};const x=vd[w]!=null?vd[w]:vd[String(w)];return x!==undefined&&x!==null&&x!==""?Number(x)||0:Number(t.vagas||0)}
function vagasDe(t,data){if(!t)return 0;const ex=data?Number((t.vagasExtra||{})[data]||0):0;return Math.max(0,vagasSemana(t,data?wd(data):-1)+ex)}
function resumoVagas(t){const ds_=(t.dias||[]).slice().sort((x,y)=>((x+6)%7)-((y+6)%7));const vs=ds_.map(d=>vagasSemana(t,d));
  if(!vs.length||vs.every(v=>v===vs[0]))return (vs[0]??Number(t.vagas||0))+" vagas";return ds_.map((d,i)=>DIAS[d]+" "+vs[i]).join(" · ")+" vagas"}
/* aluno: ocupação real das aulas (sem ver quem) */
let OCC={},occOk=false;
async function carregarOcupacao(){if(ROLE!=="aluno")return;try{const hoje=ds(new Date());const L=await SMCT.rpc("ocupacao",{p_de:addDays(hoje,-1),p_ate:addDays(hoje,31)});
  const m={};for(const r of L||[])m[r.turma_id+"|"+r.data]={n:Number(r.n)||0,k:Number(r.criancas)||0};OCC=m;occOk=true;render()}catch(e){console.error(e)}}
async function depoisAluno(){await Promise.all([SMCT.recarregar(["reservas","movimentos","espera","alunos","pedidos"]),carregarOcupacao(),carregarQuem()])}
/* quem vai em cada horário (aluno vê só o primeiro nome + inicial) */
let QUEM={},quemOk=false,quemErro=false;
async function carregarQuem(){if(ROLE!=="aluno")return;try{const hoje=ds(new Date());const L=await SMCT.rpc("quem_na_aula",{p_de:addDays(hoje,-1),p_ate:addDays(hoje,31)});
  const m={};for(const r of L||[]){const k=r.turma_id+"|"+r.data;(m[k]=m[k]||[]).push(r.nome)}QUEM=m;quemOk=true;quemErro=false;render()}catch(e){console.error(e);quemErro=true;render()}}
function nomeCurto(n){const p=String(n||"").trim().split(/\s+/).filter(Boolean);return p.length?p[0]+(p[1]?" "+p[1][0]+".":""):"Aluno"}
function quemVai(tid,d){if(ROLE==="aluno")return quemOk?(QUEM[tid+"|"+d]||[]):null;
  return S.reservas.filter(r=>r.turmaId===tid&&r.data===d&&["agendado","confirmado","presente"].includes(r.status)).map(r=>{const a=aluno(r.alunoId);return a?nomeCurto(a.nome):"Aluno"})}
function quemHtml(tid,d){const L=quemVai(tid,d),k=tid+"|"+d;S.quemAberto=S.quemAberto||{};
  return `<details class="quem" data-det="quem" data-k="${esc(k)}" ${S.quemAberto[k]?"open":""}><summary><span class="quem-ic" aria-hidden="true">👥</span>Quem vai${L?` · <b class="num">${L.length}</b>`:""}<span class="chev" aria-hidden="true"></span></summary><div class="quem-l">${L==null?`<span class="meta">${quemErro?"Lista indisponível no momento.":"Carregando…"}</span>`:L.length?L.map(x=>`<span class="quem-n">${esc(x)}</span>`).join(""):`<span class="meta">Ninguém agendado ainda.</span>`}</div></details>`}

const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DIAS_LONGO=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const ATIVOS=["agendado","confirmado"];
const PERIODOS={mensal:["Mensal",1],trimestral:["Trimestral",3],semestral:["Semestral",6],anual:["Anual",12]};
const FORMAS=["Pix","Pix Sicoob","Cartão","Cartão de crédito","Cartão recorrente","Recorrente InfinitePay","Cartão de débito","Dinheiro","Sicoob","Boleto","Transferência"];
const S={alunos:[],turmas:[],reservas:[],movs:[],espera:[],cfg:{modalidades:[],planos:[]},regras:{minutosDesmarcar:30,nome:""},
  avisos:[],mensagens:[],treinos:[],metodo:null,pagamentos:[],contas:[],materiais:[],eventos:[],eventoItens:[],comissoes:[],aulasProf:[],finCfg:{},finMes:null,finSub:"resumo",finFiltro:"todos",iaBusy:null,todosTreinos:{},monPag:0,profSub:"horarios",prof:null,contratos:[],contratoModelo:null,parceiros:[],produtos:[],pedidos:[],subAluno:"aulas",subCom:"mensagens",
  loaded:{alunos:false,turmas:false,reservas:false,movs:false,espera:false},
  tab:"contatar",dia:ds(new Date()),busca:"",meu:null,sheet:null,busy:false};
let db=null;
try{S.meu=localStorage.getItem("meuAluno");S.prof=localStorage.getItem("meuProf")}catch(e){}
try{const t=localStorage.getItem("aba");if(t)S.tab=t}catch(e){}
if(!TABS.includes(S.tab))S.tab=TABS[0];
if(ROLE==="aluno"){S.tab="aluno";S.meu=PERFIL.aluno_id||null}
if(ROLE==="professor"){S.prof=PERFIL.nome||S.prof;if(S.tab==="contatar")S.tab="professor"}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(str,n){const d=new Date(str+"T12:00:00");d.setDate(d.getDate()+n);return ds(d)}
function wd(str){return new Date(str+"T12:00:00").getDay()}
function fmtD(str){const d=new Date(str+"T12:00:00");return DIAS[d.getDay()].toLowerCase()+", "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
function relD(str){const t=ds(new Date());if(str===t)return"hoje";if(str===addDays(t,1))return"amanhã";if(str===addDays(t,-1))return"ontem";return fmtD(str)}
function turma(id){return S.turmas.find(t=>t.id===id)}
function aluno(id){return S.alunos.find(a=>a.id===id)}
function inicio(r){const t=turma(r.turmaId);return new Date(r.data+"T"+((t&&t.hora)||"00:00")+":00").getTime()}
function saldoTipo(id,tipo){let s=0;for(const m of S.movs)if(m.alunoId===id&&m.tipo===tipo)s+=Number(m.delta)||0;return s}
function saldo(id){return saldoTipo(id,"credito")}
function saldoFerias(id){return saldoTipo(id,"ferias")}
const FERIAS_DIAS={mensal:0,trimestral:15,semestral:20,anual:30};
const CONTA=["agendado","confirmado","presente","falta"];
function semanaIni(data){const d=new Date(data+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)}
/* aulas da semana: reservas que contam + horários fixos ainda não lançados (a partir de hoje, fora das férias) */
function aulasNaSemana(aid,data){const i=semanaIni(data),f=addDays(i,6);
  let n=S.reservas.filter(r=>r.alunoId===aid&&r.data>=i&&r.data<=f&&CONTA.includes(r.status)&&!(turma(r.turmaId)||{}).semCredito).length;
  const a=aluno(aid);if(!a)return n;const hoje=ds(new Date());
  for(let d=i;d<=f;d=addDays(d,1)){if(d<hoje||emFerias(a,d))continue;
    for(const tid of (a.fixos||[])){const t=turma(tid);if(!t||t.semCredito||!diasDoFixo(a,t).includes(wd(d)))continue;
      if(!S.reservas.some(r=>r.id===aid+"_"+tid+"_"+d))n++}}
  return n}
function diasDoFixo(a,t){const td=(t&&t.dias)||[];const ch=((a&&a.fixosDias)||{})[t&&t.id];return Array.isArray(ch)&&ch.length?td.filter(d=>ch.includes(d)):td}
function repNoMes(aid,data){const m=data.slice(0,7);return S.reservas.filter(r=>r.alunoId===aid&&r.tipo==="reposicao"&&r.data.slice(0,7)===m&&CONTA.includes(r.status)).length}
function vezes(a){return Number(a.vezesSemana)||0}
function limiteRep(a){return a.reposicoesMes===""||a.reposicoesMes==null?3:Number(a.reposicoesMes)}
function classificar(a,turmaId,data){
  const t=turma(turmaId);if(!t||t.semCredito)return{tipo:"livre"};
  if((a.fixos||[]).includes(turmaId)&&diasDoFixo(a,t).includes(wd(data)))return{tipo:"fixo"};
  const v=vezes(a);if(!v||aulasNaSemana(a.id,data)<v)return{tipo:"regular"};
  const usadas=repNoMes(a.id,data),lim=limiteRep(a),cr=saldo(a.id),fe=saldoFerias(a.id);
  return{tipo:"reposicao",usadas,lim,cr,fe,podeCredito:usadas<lim&&cr>0,podeFerias:fe>0}}
function diasEntre(i,f){return Math.round((new Date(f+"T12:00:00")-new Date(i+"T12:00:00"))/864e5)+1}
function feriasDireito(a){return FERIAS_DIAS[a.periodo]||0}
function feriasUsadas(a){return (a.ferias||[]).filter(f=>(!a.inicio||f.inicio>=a.inicio)&&(!a.fim||f.inicio<=a.fim)).reduce((s,f)=>s+(Number(f.dias)||diasEntre(f.inicio,f.fim)),0)}
function telDe(a){return a.telefone||((aluno(a.responsavelId)||{}).telefone)||""}
function dependentes(a){return S.alunos.filter(x=>x.responsavelId===a.id).sort((x,y)=>x.nome.localeCompare(y.nome))}
function emFerias(a,data){return (a.ferias||[]).some(f=>data>=f.inicio&&data<=f.fim)}
function ocupadas(turmaId,data){if(ROLE==="aluno"){const o=OCC[turmaId+"|"+data];return o?o.n:0}return S.reservas.filter(r=>r.turmaId===turmaId&&r.data===data&&["agendado","confirmado","presente"].includes(r.status)).length}
function minDesm(){const m=Number(S.regras.minutosDesmarcar);return isFinite(m)&&S.regras.minutosDesmarcar!==""&&S.regras.minutosDesmarcar!=null?m:30}
function prazoTxt(){const m=minDesm();return m>=60&&m%60===0?(m/60)+"h":m+" min"}
function prazoOk(r){return inicio(r)-Date.now()>=minDesm()*60e3}
const MOD_CORES=["#A8743C","#B5615A","#4F8452","#46709A","#7E5EA3","#B0602A","#8E7A2C","#2F8277"];
const COR_ANTIGA={"#E5BF94":0,"#E3A090":1,"#A9C3A1":2,"#9DB4CC":3,"#C2A8D6":4,"#D58E5C":5,"#D8C88F":6,"#86C0B6":7};
function corMod(m){if(!m)return MOD_CORES[0];let c=(S.cfg.cores||{})[m];if(c&&c in COR_ANTIGA)c=MOD_CORES[COR_ANTIGA[c]];if(c)return c;const i=S.cfg.modalidades.indexOf(m);return MOD_CORES[(i<0?0:i)%MOD_CORES.length]}
function chipsDias(opts,key,dias){const hoje=ds(new Date());const comAula=new Set(opts.map(o=>o.d));
  let sel=(S.diaSel||{})[key];if(!sel||sel<hoje||sel>addDays(hoje,dias-1))sel=[...comAula].sort()[0]||hoje;
  let h=`<div class="chips" role="group" aria-label="Escolha o dia">`;
  for(let i=0;i<dias;i++){const d=addDays(hoje,i),dt=new Date(d+"T12:00:00");const tem=comAula.has(d);
    h+=`<button class="chip ${tem?"":"vazio"}" aria-pressed="${d===sel}" data-act="diaSel" data-k="${key}" data-v="${d}" aria-label="${DIAS_LONGO[dt.getDay()]} ${dt.getDate()}${tem?"":", sem horários"}"><small>${DIAS[dt.getDay()]}</small><b>${String(dt.getDate()).padStart(2,"0")}</b>${tem?`<span class="pt" aria-hidden="true"></span>`:""}</button>`}
  return {html:h+`</div>`,sel}}
function cap(x){x=String(x||"").toLowerCase();return x.charAt(0).toUpperCase()+x.slice(1)}
function modTag(t){return t&&t.modalidade?`<span class="modtag">${esc(t.modalidade)}</span>`:""}
function profTxt(t){return t&&t.professor?`<span class="prof">com <b>${esc(t.professor)}</b></span>`:`<span class="prof">Professor a definir</span>`}
function digits(p){return String(p||"").replace(/\D/g,"")}
function waLink(a,r){let d=digits(telDe(a));if(!d)return null;if(d.length<=11)d="55"+d;
  const t=r&&turma(r.turmaId);const msg=r&&t?`Oi ${a.nome.split(" ")[0]}! Tudo bem? Você vem na aula de ${t.nome} ${relD(r.data)} às ${t.hora}?`:`Oi ${a.nome.split(" ")[0]}!`;
  return "https://wa.me/"+d+"?text="+encodeURIComponent(msg)}
const STATUS={agendado:["Agendado","p-acc"],confirmado:["Agendado","p-acc"],presente:["Presente","p-acc"],falta:["Faltou","p-bad"],desmarcado:["Desmarcou","p-neutral"],ferias:["Férias","p-neutral"]};
function pill(st){const s=STATUS[st]||[st,"p-neutral"];return `<span class="pill ${s[1]}"><span class="dot"></span>${s[0]}</span>`}
function saldoPill(n){const c=n<0?"p-bad":n===0?"p-neutral":"p-ok";return `<span class="pill ${c} num">${n} ${Math.abs(n)===1?"crédito":"créditos"}</span>`}
function feriasPill(n){return n?`<span class="pill p-acc num">${n} férias</span>`:""}

function toast(msg){const h=document.getElementById("toastHost");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML="",2600)}

async function mov(alunoId,delta,motivo,reservaId,tipo){await db.collection("movimentos").add({alunoId,delta,motivo,tipo:tipo||"credito",reservaId:reservaId||null,em:new Date().toISOString()})}
/* fonte: "credito" | "ferias" | "extra" (sem desconto, só equipe). Retorna "ok" | "ja" | "erro" | {precisa: classificação} */
async function criarReserva(alunoId,turmaId,data,pedido,criancas,fonte){
  if(ROLE==="aluno"){try{const r=await SMCT.rpc("aluno_agendar",{p_aluno:alunoId,p_turma:turmaId,p_data:data,p_criancas:Math.max(0,parseInt(criancas,10)||0),p_fonte:fonte==="credito"||fonte==="ferias"?fonte:null});await depoisAluno();return r}
    catch(e){if(SMCT.codigoErro(e)==="precisa_credito"){await depoisAluno();const a=aluno(alunoId);return a?{precisa:classificar(a,turmaId,data)}:"erro"}throw e}}
  const t=turma(turmaId),a=aluno(alunoId);if(!t||!a)return"erro";
  const id=alunoId+"_"+turmaId+"_"+data;
  const ex=S.reservas.find(r=>r.id===id);
  if(ex&&CONTA.includes(ex.status))return"ja";
  let tipo,fo=null;
  if(pedido==="fixo")tipo="fixo";
  else{const c=classificar(a,turmaId,data);
    if(c.tipo!=="reposicao")tipo=c.tipo;
    else{tipo="reposicao";
      if(fonte==="credito"&&c.podeCredito)fo="credito";else if(fonte==="ferias"&&c.podeFerias)fo="ferias";else if(fonte==="extra")fo="extra";
      else return{precisa:c}}}
  await db.doc("reservas/"+id).set({alunoId,turmaId,data,status:"agendado",tipo,fonte:fo,profResp:a.profStudio||"",criancas:Math.max(0,parseInt(criancas,10)||0),contatado:false,criadoEm:new Date().toISOString()});
  if(fo==="credito"||fo==="ferias")await mov(alunoId,-1,`Reposição: ${t.nome}, ${fmtD(data)}`,id,fo);
  const e=S.espera.find(x=>x.id===id);if(e&&e.status!=="atendido")await db.doc("espera/"+id).update({status:"atendido"});
  return"ok"}
async function liberarVaga(turmaId,data){
  for(const e of S.espera.filter(x=>x.turmaId===turmaId&&x.data===data&&x.status==="aguardando"))
    await db.doc("espera/"+e.id).update({status:"vaga",vagaEm:new Date().toISOString(),contatado:false})}
async function desmarcar(r,devolver,quem){
  if(!ATIVOS.includes(r.status))return;
  if(ROLE==="aluno"){await SMCT.rpc("aluno_desmarcar",{p_reserva:r.id});await depoisAluno();return}
  const t=turma(r.turmaId);const ganho=devolver?creditoAoDesmarcar(r):null;
  await db.doc("reservas/"+r.id).update({status:"desmarcado",creditoDevolvido:!!ganho,desmarcadoPor:quem,desmarcadoEm:new Date().toISOString()});
  if(ganho)await mov(r.alunoId,1,`${ganho==="ferias"?"Crédito de férias devolvido":"Crédito de reposição"}: desmarcou ${t?t.nome:"aula"}, ${fmtD(r.data)}`,r.id,ganho);
  if(inicio(r)>Date.now())await liberarVaga(r.turmaId,r.data)}
/* que crédito o aluno recebe ao desmarcar no prazo */
function creditoAoDesmarcar(r){const t=turma(r.turmaId)||{};
  if(r.tipo==="reposicao")return r.fonte==="credito"||r.fonte==="ferias"?r.fonte:null;
  if(r.tipo==="livre"||t.semCredito)return null;
  return"credito"}
async function setStatus(r,status,extra){await db.doc("reservas/"+r.id).update(Object.assign({status},extra||{}))}
/* aulas que o aluno faria no período: horários fixos + aulas regulares avulsas já agendadas */
function aulasPrevistas(a,ini,fim){
  const de=ini<ds(new Date())?ds(new Date()):ini;if(de>fim)return 0;
  let n=0;const fx=(a.fixos||[]).map(turma).filter(Boolean);
  for(let d=de;d<=fim;d=addDays(d,1))for(const t of fx)if(diasDoFixo(a,t).includes(wd(d))&&!t.semCredito)n++;
  const avulsas=S.reservas.filter(r=>r.alunoId===a.id&&ATIVOS.includes(r.status)&&r.data>=de&&r.data<=fim&&r.tipo!=="fixo"&&r.tipo!=="reposicao"&&r.tipo!=="livre"&&!(turma(r.turmaId)||{}).semCredito).length;
  n+=avulsas;
  if(!fx.length)n=Math.max(n,Math.round(vezes(a)*diasEntre(de,fim)/7));
  return n}
async function addFerias(a,ini,fim){
  if(ROLE==="aluno"){const n=await SMCT.rpc("aluno_ferias",{p_aluno:a.id,p_ini:ini,p_fim:fim});await depoisAluno();return n}
  const n=aulasPrevistas(a,ini,fim);
  const f={id:"f"+Date.now().toString(36),inicio:ini,fim:fim,dias:diasEntre(ini,fim),creditos:n};
  await db.doc("alunos/"+a.id).update({ferias:[...(a.ferias||[]),f]});
  const afetadas=S.reservas.filter(r=>r.alunoId===a.id&&ATIVOS.includes(r.status)&&r.data>=ini&&r.data<=fim);
  for(const r of afetadas){const t=turma(r.turmaId);
    const volta=r.tipo==="reposicao"&&(r.fonte==="credito"||r.fonte==="ferias")?r.fonte:null;
    await db.doc("reservas/"+r.id).update({status:"ferias",creditoDevolvido:!!volta});
    if(volta)await mov(a.id,1,`Reposição devolvida (férias): ${t?t.nome:"aula"}, ${fmtD(r.data)}`,r.id,volta);
    await liberarVaga(r.turmaId,r.data)}
  if(n)await mov(a.id,n,`Créditos de férias: ${fmtD(ini)} a ${fmtD(fim)}`,null,"ferias");
  return n}
async function removerFerias(a,fid){if(ROLE==="aluno"){await SMCT.rpc("aluno_cancelar_ferias",{p_aluno:a.id,p_fid:fid});await depoisAluno();return}const f=(a.ferias||[]).find(x=>x.id===fid);if(!f)return;
  await db.doc("alunos/"+a.id).update({ferias:(a.ferias||[]).filter(x=>x.id!==fid)});
  if(Number(f.creditos))await mov(a.id,-Number(f.creditos),`Férias canceladas: ${fmtD(f.inicio)} a ${fmtD(f.fim)}`,null,"ferias")}
function autoOn(){return S.regras.autoFixos!==false}
function diasFixos(){const n=Number(S.regras.diasFixos);return n>=1&&n<=60?n:14}
async function lancarFixos(dias,soAluno){
  const hoje=ds(new Date());let n=0;dias=Number(dias)||diasFixos();
  for(let i=0;i<dias;i++){const d=addDays(hoje,i),w=wd(d);
    for(const a of S.alunos){if(soAluno&&a.id!==soAluno)continue;if(emFerias(a,d))continue;
      if(a.ativo===false&&(!a.saidaEm||a.saidaEm<=d))continue;if(a.fim&&a.fim<d)continue;if(a.inicio&&a.inicio>d)continue;
      for(const tid of (a.fixos||[])){const t=turma(tid);if(!t||!diasDoFixo(a,t).includes(w))continue;
        const id=a.id+"_"+tid+"_"+d;if(S.reservas.some(r=>r.id===id))continue;
        if(new Date(d+"T"+t.hora+":00").getTime()<Date.now())continue;
        const res=await criarReserva(a.id,tid,d,"fixo");if(res==="ok"){n++;S.reservas.push({id,alunoId:a.id,turmaId:tid,data:d,status:"agendado",tipo:"fixo"})}}}}
  return n}
function fixosDaTurma(t){

  ${disp.length?`<div class="busca"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="fxs_${t.id}" type="search" data-fxbusca="${t.id}" placeholder="Buscar aluno para adicionar" aria-label="Buscar aluno para adicionar ao horário fixo" autocomplete="off" value="${esc((S.fxBusca||{})[t.id]||"")}"></div><div id="fxr_${t.id}" class="stack" style="gap:4px">${resultadosFixo(t.id)}</div>`:""}</div>`}
function semAcento(x){return String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function resultadosFixo(tid){const q=semAcento((S.fxBusca||{})[tid]);if(!q)return"";
  const L=S.alunos.filter(a=>a.ativo!==false&&!(a.fixos||[]).includes(tid)&&semAcento(a.nome).includes(q)).sort((x,y)=>{const ix=semAcento(x.nome).startsWith(q)?0:1,iy=semAcento(y.nome).startsWith(q)?0:1;return ix-iy||x.nome.localeCompare(y.nome)});

/* geração automática: roda ao abrir o app (no máx. 1x por hora por aparelho) e ao salvar os fixos de um aluno */
let autoUltimo=0,autoRodando=false;

async function limparFixosRemovidos(aid,fixos){const now=Date.now();const a=aluno(aid)||{};

    await db.doc("reservas/"+r.id).delete();await liberarVaga(r.turmaId,r.data)}}

/* ---------- lista de contato ---------- */
function paraContatar(){
  const now=Date.now(),lim=ds(new Date(now-7*864e5));
  const out=[];
  for(const r of S.reservas){if(r.contatado||r.data<lim)continue;const a=aluno(r.alunoId);if(!a)continue;
    const t0=inicio(r);
    if(ATIVOS.includes(r.status)&&t0+3600e3<=now)out.push({r,a,motivo:"Aula já passou: registre se veio ou faltou",nivel:"wait"});
    else if(r.status==="falta")out.push({r,a,motivo:"Faltou sem desmarcar",nivel:"bad"})}
  return out.sort((x,y)=>inicio(x.r)-inicio(y.r))}
function diasAteNiver(a){if(!a.nascimento)return null;const [,m,d]=a.nascimento.split("-").map(Number);const hoje=new Date();hoje.setHours(12,0,0,0);
  let n=new Date(hoje.getFullYear(),m-1,d,12);if(n<hoje)n=new Date(hoje.getFullYear()+1,m-1,d,12);return Math.round((n-hoje)/864e5)}
function aniversariantes(){const ano=new Date().getFullYear();return S.alunos.map(a=>({a,dias:diasAteNiver(a)})).filter(x=>x.dias!==null&&x.dias<=7&&!(x.dias===0&&x.a.parabensAno===ano)).sort((x,y)=>x.dias-y.dias)}
function vagasLiberadas(){const now=Date.now();return S.espera.filter(e=>e.status==="vaga"&&!e.contatado&&aluno(e.alunoId)&&turma(e.turmaId)&&new Date(e.data+"T"+turma(e.turmaId).hora+":00").getTime()>now)}
function planoDe(a){return S.cfg.planos.find(p=>p.id===a.plano)||null}
function normNome(x){return String(x||"").trim().toLowerCase()}
function ehStudio(t){return !!(t&&(t.studio||normNome(t.modalidade).includes("studio")))}
function doStudio(a,t){return !!(t&&ehStudio(t)&&a.profStudio&&normNome(a.profStudio)===normNome(t.professor))}
function modsExtra(a){return Array.isArray(a&&a.modsExtra)?a.modsExtra:[]}
function permitido(a,t){const p=planoDe(a);if(!p||!(p.modalidades||[]).length||!t.modalidade)return true;return p.modalidades.includes(t.modalidade)||modsExtra(a).includes(t.modalidade)}
function professores(){return [...new Set(S.turmas.map(t=>String(t.professor||"").trim()).filter(Boolean))].sort((x,y)=>x.localeCompare(y))}
function fimSugerido(ini,per){if(!ini||!PERIODOS[per])return"";const d=new Date(ini+"T12:00:00");const dia=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+PERIODOS[per][1]);const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(dia,ult));d.setDate(d.getDate()-1);return ds(d)}
function proxPagamento(a){if(a.pagamento!=="mensal"||!a.diaPagamento)return null;const hoje=ds(new Date());const base=new Date();
  for(let k=0;k<3;k++){const y=base.getFullYear(),m=base.getMonth()+k;const ult=new Date(y,m+1,0).getDate();const d=ds(new Date(y,m,Math.min(Number(a.diaPagamento),ult),12));
    if(d>=hoje&&(!a.fim||d<=a.fim)&&(!a.inicio||d>=a.inicio))return d}return null}
function diasAte(str){const a=new Date(ds(new Date())+"T12:00:00"),b=new Date(str+"T12:00:00");return Math.round((b-a)/864e5)}
function fmtFull(str){if(!str)return"";const [y,m,d]=str.split("-");return d+"/"+m+"/"+y}
function renovacoes(){const out=[];for(const a of S.alunos){
    if(a.fim){const n=diasAte(a.fim);if(n<=7&&n>=-15&&a.renovAvisado!==a.fim)out.push({a,tipo:"renov",n})}

  return out.sort((x,y)=>x.n-y.n)}

function temaPlano(p){const n=normNome(p&&p.nome);if(!n)return"";if(n.includes("standard"))return"pl-standard";if(n.includes("full pass")||n.includes("fullpass")||n.includes("full"))return"pl-full";if(n.includes("moviment")||n.includes("movement"))return"pl-moviment";if(n.includes("black space")||n.includes("blackspace"))return"pl-space";if(n.includes("black"))return"pl-black";if(n.includes("basic"))return"pl-basic";if(n.includes("promo"))return"pl-promo";return""}
function cardTreino(a){
  const hoje=ds(new Date()),v=vezes(a),k=aulasNaSemana(a.id,hoje),cr=saldo(a.id),fe=saldoFerias(a.id),us=repNoMes(a.id,hoje),lim=limiteRep(a);
  const mes=new Date().toLocaleDateString("pt-BR",{month:"long"});
  const stat=(rot,val,sub,cls)=>`<div class="stat"><div class="eyebrow">${rot}</div><div class="saldo ${cls||""}" style="font-size:30px">${val}</div><div class="meta">${sub}</div></div>`;
  return `<div class="card treino"><div class="row between"><h3>Meu treino</h3>${v?`<span class="pill p-acc">${v}x por semana</span>`:`<span class="pill p-neutral">Frequência não definida</span>`}</div>
  <div class="stats">${stat("Esta semana",v?`${k}<span class="meta" style="font-size:16px"> / ${v}</span>`:k,v?(k>=v?"semana completa; a próxima aula é reposição":`${v-k} ${v-k===1?"aula":"aulas"} ainda dentro do plano`):"aulas agendadas")}
  ${stat("Créditos de reposição",cr,cr===1?"aula desmarcada para repor":"aulas desmarcadas para repor",cr<0?"minus":"")}
  ${stat("Reposições em "+mes,`${us}<span class="meta" style="font-size:16px"> / ${lim}</span>`,us>=lim?"limite do mês atingido":`${lim-us} ainda ${lim-us===1?"disponível":"disponíveis"}`)}
  ${stat("Créditos de férias",fe,fe?"pode usar quando passar do limite de reposições":"gerados quando você avisa férias")}</div></div>`}

function cardPlano(a,staff){
  const p=planoDe(a);const hoje=ds(new Date());const venc=a.fim&&a.fim<hoje;const pg=proxPagamento(a);
  if(!staff){
    if(!p&&!a.fim)return "";
    const resumo=venc?"Vencido · toque para ver":pg?`Próximo pagamento ${fmtFull(pg)}`:a.fim?`Renovação em ${fmtFull(a.fim)}`:"Toque para ver os detalhes";
    let h=`<details class="card plano ${temaPlano(p)}" data-det="plano" ${S.planoAberto?"open":""}><summary><div class="grow"><div class="eyebrow">Seu plano</div><h2>${esc(p?p.nome:"Plano")}</h2><div class="meta">${resumo}</div></div>${venc?`<span class="pill p-bad">Vencido</span>`:a.fim&&diasAte(a.fim)<=7?`<span class="pill p-wait">Renovar em breve</span>`:`<span class="pill p-ok">Ativo</span>`}<span class="chev" aria-hidden="true"></span></summary><div class="stack" style="gap:12px;padding-top:6px">`;
    h+=`<div class="formgrid">`;
    if(p&&(p.modalidades||[]).length)h+=`<div><div class="eyebrow">Modalidades</div><div>${p.modalidades.map(esc).join(", ")}</div></div>`;
    if(modsExtra(a).length)h+=`<div><div class="eyebrow">Modalidade adicional</div><div>${modsExtra(a).map(esc).join(", ")}</div></div>`;
    if(a.periodo)h+=`<div><div class="eyebrow">Tipo</div><div>${PERIODOS[a.periodo]?PERIODOS[a.periodo][0]:""}${a.pagamento?" · "+(a.pagamento==="mensal"?"pagamento mensal":"pagamento único"):""}</div></div>`;
    if(a.inicio||a.fim)h+=`<div><div class="eyebrow">Vigência</div><div class="num">${fmtFull(a.inicio)}${a.fim?" até "+fmtFull(a.fim):""}</div></div>`;
    if(a.forma)h+=`<div><div class="eyebrow">Forma de pagamento</div><div>${esc(a.forma)}</div></div>`;
    if(vezes(a))h+=`<div><div class="eyebrow">Frequência</div><div>${vezes(a)}x por semana · até ${limiteRep(a)} reposições/mês</div></div>`;
    if(feriasDireito(a))h+=`<div><div class="eyebrow">Férias do plano</div><div>${feriasDireito(a)} dias (${Math.max(0,feriasDireito(a)-feriasUsadas(a))} restantes)</div></div>`;
    h+=`</div>`;
    if(pg)h+=`<div class="note"><b>Próximo pagamento:</b> ${fmtFull(pg)} (todo dia ${a.diaPagamento})</div>`;
