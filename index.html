<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SM|CT">
<title>SM|CT Estúdio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de app, cabeçalho fixo no topo, abas fixas embaixo; preto com dourado champanhe da marca */
:root{
  --bg:#0e0d0b; --surface:#17150f; --surface-2:#201d16; --line:#2e2a21;
  --fg:#efe9dc; --muted:#a39985; --gold:#cdb37e; --gold-ink:#1a160d;
  --ok:#7fbf8e; --warn:#e2b45c; --bad:#e07b6e;
  --display:"Bodoni Moda", "Didot", "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.mark{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.02em;color:var(--fg);line-height:1}
.mark b{color:var(--gold);font-weight:500;padding-inline:2px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{padding-block:18px 110px}
h1,h2{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.item{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
button.item:first-child{border-top:0}
.time{font-family:var(--display);font-size:22px;min-width:64px;color:var(--gold)}

.credit{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.credit .big{font-family:var(--display);font-size:52px;line-height:.9;color:var(--gold)}

/* chips de status */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-agendado{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.s-confirmado{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.s-presente{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.s-falta,.s-cancelado{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.chip.plain::before{display:none}

/* botões */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.wide{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.input:focus-visible,.tab:focus-visible,.day:focus-visible,button.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* formulários */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--fg)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg)}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* seletor de dias */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:58px;padding:9px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;cursor:pointer;color:var(--fg)}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.day b{font-family:var(--display);font-size:20px;font-weight:500}
.day[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.day[aria-pressed="true"] small{color:var(--gold-ink)}

.alert{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex;gap:4px;padding-block:8px}
.tab{flex:1;background:none;border:0;border-radius:10px;padding:10px 4px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--gold);background:var(--surface)}

/* login */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:40px}
.auth .mark{font-size:46px}
.motto{font-family:var(--display);font-style:italic;color:var(--muted);font-size:17px;margin-top:8px}
.switch{background:none;border:0;color:var(--gold);font-weight:600;cursor:pointer;padding:0}

/* painel */
dialog{border:0;padding:0;background:transparent;max-width:100vw;width:100%;margin:auto auto 0;color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow-y:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{background:var(--bad);color:#1b0d0a}

@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
/* ============ Configuração ============ */
const SUPA_URL = 'https://rjecpvklyybuqrqrctur.supabase.co';
const SUPA_KEY = 'sb_publishable_rtA2au0_IqkmRaxD3FI9Ig_AyEv33pz';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DC = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const hm = t => (t || '').slice(0,5);
const fmtData = s => { const d = parseISO(s); return `${DC[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const STATUS = {agendado:'Não confirmou', confirmado:'Confirmado', presente:'Presente', falta:'Falta', cancelado:'Cancelado'};
const chip = s => `<span class="chip s-${s}">${STATUS[s] || s}</span>`;
const aulaPassou = (data, horario) => new Date(`${data}T${hm(horario)}:00`) < new Date();
const soDigitos = t => (t || '').replace(/\D/g, '');

function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200);
}
function erro(e) {
  const m = e?.message || String(e);
  const mapa = {
    'Invalid login credentials': 'E-mail ou senha incorretos.',
    'Email not confirmed': 'Confirme seu e-mail pelo link que enviamos antes de entrar.',
    'User already registered': 'Já existe uma conta com esse e-mail. Tente entrar.',
  };
  toast(mapa[m] || m, true);
}
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }

/* ============ Estado ============ */
const S = { user:null, perfil:null, aluno:null, tab:null, dia:iso(new Date()), dataAgenda:iso(new Date()), busca:'' };

/* ============ Início ============ */
sb.auth.onAuthStateChange((ev) => {
  if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') setTimeout(boot, 0);
});
async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { S.user = null; return renderAuth('entrar'); }
  if (S.user?.id === session.user.id && S.perfil) return;
  S.user = session.user;
  try {
    S.perfil = await q(sb.from('perfis').select('*').eq('id', S.user.id).maybeSingle()) || { papel:'aluno', nome:'' };
    await carregarAluno();
  } catch (e) { erro(e); S.perfil = { papel:'aluno', nome:'' }; }
  S.tab = { admin:'agenda', professor:'agenda', aluno:'agendar' }[S.perfil.papel];
  render();
}
async function carregarAluno() {
  if (S.perfil.papel !== 'aluno') return;
  S.aluno = await q(sb.from('alunos').select('*, planos(nome)').eq('user_id', S.user.id).maybeSingle());
}

/* ============ Login / cadastro ============ */
function renderAuth(modo) {
  const cad = modo === 'cadastro';
  $('#app').innerHTML = `
  <div class="wrap auth">
    <div>
      <div class="mark">SM<b>|</b>CT</div>
      <div class="motto">Lugar que acolhe, desafia e transforma</div>
    </div>
    <form id="fAuth" class="stack" novalidate>
      <h2>${cad ? 'Criar conta' : 'Entrar'}</h2>
      ${cad ? `<label class="f">Nome completo<input class="input" id="aNome" autocomplete="name" required></label>` : ''}
      <label class="f">E-mail<input class="input" id="aEmail" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="f">Senha<input class="input" id="aSenha" type="password" autocomplete="${cad ? 'new-password' : 'current-password'}" minlength="6" required></label>
      <button class="btn gold wide" type="submit">${cad ? 'Criar conta' : 'Entrar'}</button>
      <p class="small muted" style="margin:0">${cad
        ? 'Já tem conta? <button type="button" class="switch" data-modo="entrar">Entrar</button>'
        : 'Primeira vez aqui? <button type="button" class="switch" data-modo="cadastro">Criar conta</button>'}</p>
      ${cad ? '<p class="small muted" style="margin:0">Use o mesmo e-mail que você informou na recepção do estúdio.</p>' : ''}
    </form>
  </div>`;
  $('.switch').onclick = e => renderAuth(e.target.dataset.modo);
  $('#fAuth').onsubmit = async e => {
    e.preventDefault();
    const email = $('#aEmail').value.trim(), senha = $('#aSenha').value;
    if (!email || senha.length < 6) return toast('Preencha o e-mail e uma senha com pelo menos 6 caracteres.', true);
    const btn = e.submitter; btn.disabled = true;
    try {
      if (cad) {
        const nome = $('#aNome').value.trim();
        if (!nome) { btn.disabled = false; return toast('Informe seu nome.', true); }
        const { data, error } = await sb.auth.signUp({ email, password:senha,
          options:{ data:{ nome }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!data.session) { toast('Conta criada. Abra o link que enviamos para o seu e-mail.'); renderAuth('entrar'); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password:senha });
        if (error) throw error;
      }
    } catch (err) { erro(err); btn.disabled = false; }
  };
}

/* ============ Estrutura ============ */
const ABAS = {
  admin:     [['agenda','Agenda'],['alunos','Alunos'],['turmas','Turmas'],['equipe','Equipe']],
  professor: [['agenda','Minhas turmas']],
  aluno:     [['agendar','Agendar'],['minhas','Minhas aulas'],['ferias','Férias']],
};
const PAPEL = { admin:'Administração', professor:'Professor', aluno:'Aluno' };

function render() {
  const abas = ABAS[S.perfil.papel];
  $('#app').innerHTML = `
  <header class="top"><div class="wrap">
    <div class="mark">SM<b>|</b>CT</div>
    <div class="who"><span>${esc(S.perfil.nome || S.user.email)} · ${PAPEL[S.perfil.papel]}</span>
      <button class="btn sm ghost" id="sair">Sair</button></div>
  </div></header>
  <main class="wrap" id="view"></main>
  ${abas.length > 1 ? `<nav class="tabs"><div class="wrap">${abas.map(([k,l]) =>
    `<button class="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${l}</button>`).join('')}</div></nav>` : ''}`;
  $('#sair').onclick = async () => { S.perfil = null; S.aluno = null; await sb.auth.signOut(); };
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  const v = { agenda:vAgenda, alunos:vAlunos, turmas:vTurmas, equipe:vEquipe, agendar:vAgendar, minhas:vMinhas, ferias:vFerias }[S.tab];
  $('#view').innerHTML = '<div class="empty">Carregando…</div>';
  v().catch(e => { erro(e); $('#view').innerHTML = `<div class="empty">Não foi possível carregar. ${esc(e.message)}</div>`; });
}
const view = html => $('#view').innerHTML = html;

/* ============ Painel inferior ============ */
function abrirPainel(html, onSubmit) {
  $('#sheetBody').innerHTML = html;
  const d = $('#sheet'); d.showModal();
  d.onclick = e => { if (e.target === d) d.close(); };
  d.querySelectorAll('[data-fechar]').forEach(b => b.onclick = () => d.close());
  const f = d.querySelector('form');
  if (f && onSubmit) f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try { await onSubmit(f, e.submitter); d.close(); } catch (err) { erro(err); } finally { btn.disabled = false; }
  };
}

/* ============ ALUNO ============ */
function semCadastro() {
  return `<div class="alert">Seu acesso ainda não foi liberado. Peça à recepção do estúdio para cadastrar você com o e-mail <b>${esc(S.user.email)}</b>. Depois disso, é só abrir o app de novo.</div>`;
}
function cartaoCreditos() {
  const a = S.aluno;
  return `<div class="credit"><div><div class="eyebrow">Créditos disponíveis</div>
    <div class="muted small">${esc(a.planos?.nome ? 'Plano ' + a.planos.nome : 'Sem plano definido')}</div></div>
    <div class="big num">${a.creditos}</div></div>`;
}

async function vAgendar() {
  if (!S.aluno) return view(semCadastro());
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = Array.from({length:7}, (_,i) => addDays(hoje, i));
  if (!dias.some(d => iso(d) === S.dia)) S.dia = iso(hoje);
  const [turmas, meus] = await Promise.all([
    q(sb.from('turmas').select('*').order('horario')),
    q(sb.from('agendamentos').select('id,turma_id,data,status').eq('aluno_id', S.aluno.id).gte('data', iso(hoje)).lte('data', iso(dias[6]))),
  ]);
  const dSel = parseISO(S.dia);
  const doDia = turmas.filter(t => t.dia_semana === dSel.getDay());
  const meuMapa = new Map(meus.filter(a => a.status !== 'cancelado').map(a => [`${a.turma_id}|${a.data}`, a]));

  view(`<div class="stack">
    ${cartaoCreditos()}
    <h1>Agendar aula</h1>
    <div class="days">${dias.map(d => `<button class="day" data-d="${iso(d)}" aria-pressed="${iso(d)===S.dia}">
      <small>${iso(d)===iso(hoje)?'Hoje':DC[d.getDay()]}</small><b class="num">${d.getDate()}</b></button>`).join('')}</div>
    <div class="list">${doDia.length ? doDia.map(t => {
      const meu = meuMapa.get(`${t.id}|${S.dia}`), passou = aulaPassou(S.dia, t.horario);
      const acao = meu ? chip(meu.status) : passou ? '<span class="chip plain">Encerrada</span>'
        : `<button class="btn sm gold" data-agendar="${t.id}" ${S.aluno.creditos<1?'disabled':''}>Agendar</button>`;
      return `<div class="item"><div class="time num">${hm(t.horario)}</div>
        <div class="grow"><div class="t">${esc(t.modalidade)}</div></div>${acao}</div>`;
    }).join('') : '<div class="empty">Nenhuma aula neste dia.</div>'}</div>
    ${S.aluno.creditos < 1 ? '<p class="small muted">Você está sem créditos. Fale com a recepção para renovar.</p>' : ''}
  </div>`);
  document.querySelectorAll('.day').forEach(b => b.onclick = () => { S.dia = b.dataset.d; vAgendar().catch(erro); });
  document.querySelectorAll('[data-agendar]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await q(sb.rpc('agendar', { p_turma:Number(b.dataset.agendar), p_data:S.dia }));
      toast('Aula agendada. 1 crédito usado.'); await carregarAluno(); await vAgendar();
    } catch (e) { erro(e); b.disabled = false; }
  });
}

async function vMinhas() {
  if (!S.aluno) return view(semCadastro());
  const hoje = iso(new Date());
  const [futuras, passadas] = await Promise.all([
    q(sb.from('agendamentos').select('id,data,status,reposicao,turmas(modalidade,horario)').eq('aluno_id', S.aluno.id).gte('data', hoje).neq('status','cancelado').order('data')),
    q(sb.from('agendamentos').select('id,data,status,turmas(modalidade,horario)').eq('aluno_id', S.aluno.id).lt('data', hoje).order('data', {ascending:false}).limit(10)),
  ]);
  futuras.sort((a,b) => (a.data + a.turmas.horario).localeCompare(b.data + b.turmas.horario));
  view(`<div class="stack">
    ${cartaoCreditos()}
    <h1>Minhas aulas</h1>
    <div class="list">${futuras.length ? futuras.map(a => {
      const podeDesmarcar = new Date(`${a.data}T${hm(a.turmas.horario)}:00`) - new Date() > 2*3600e3;
      return `<div class="item" style="flex-wrap:wrap"><div class="grow">
        <div class="t">${esc(a.turmas.modalidade)}${a.reposicao?' · reposição':''}</div>
        <div class="small muted num">${fmtData(a.data)} às ${hm(a.turmas.horario)}</div></div>
        <div class="row">${chip(a.status)}
          ${a.status==='agendado' ? `<button class="btn sm gold" data-conf="${a.id}">Confirmar presença</button>` : ''}
          ${podeDesmarcar && ['agendado','confirmado'].includes(a.status) ? `<button class="btn sm ghost danger" data-desm="${a.id}">Desmarcar</button>` : ''}
        </div></div>`;
    }).join('') : '<div class="empty">Você não tem aulas agendadas.</div>'}</div>
    <p class="small muted" style="margin:0">Desmarcando até 2 horas antes, o crédito volta para você.</p>
    ${passadas.length ? `<div class="eyebrow" style="margin-top:8px">Histórico recente</div>
    <div class="list">${passadas.map(a => `<div class="item"><div class="grow"><div class="t">${esc(a.turmas.modalidade)}</div>
      <div class="small muted num">${fmtData(a.data)} às ${hm(a.turmas.horario)}</div></div>${chip(a.status)}</div>`).join('')}</div>` : ''}
  </div>`);
  document.querySelectorAll('[data-conf]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await q(sb.rpc('confirmar', { p_agendamento:Number(b.dataset.conf) })); toast('Presença confirmada.'); await vMinhas(); }
    catch (e) { erro(e); b.disabled = false; }
  });
  document.querySelectorAll('[data-desm]').forEach(b => b.onclick = () => {
    abrirPainel(`<form class="stack"><h2>Desmarcar esta aula?</h2>
      <p class="muted" style="margin:0">O crédito volta para a sua conta.</p>
      <div class="row"><button type="submit" class="btn gold">Desmarcar</button><button type="button" class="btn ghost" data-fechar>Manter aula</button></div></form>`,
      async () => { await q(sb.rpc('desmarcar', { p_agendamento:Number(b.dataset.desm) }));
        toast('Aula desmarcada. Crédito devolvido.'); await carregarAluno(); await vMinhas(); });
  });
}

async function vFerias() {
  if (!S.aluno) return view(semCadastro());
  const lista = await q(sb.from('ferias').select('*').eq('aluno_id', S.aluno.id).gte('fim', iso(addDays(new Date(), -60))).order('inicio', {ascending:false}));
  view(`<div class="stack">
    <h1>Férias</h1>
    <p class="muted" style="margin:0">Avise o estúdio quando você vai viajar ou ficar um tempo fora.</p>
    <form id="fFer" class="card stack">
      <div class="grid2">
        <label class="f">Saída<input class="input" type="date" id="fIni" required min="${iso(new Date())}"></label>
        <label class="f">Volta<input class="input" type="date" id="fFim" required min="${iso(new Date())}"></label>
      </div>
      <button class="btn gold" type="submit">Registrar férias</button>
    </form>
    <div class="list">${lista.length ? lista.map(f => `<div class="item"><div class="grow num">
      <div class="t">${fmtData(f.inicio)} até ${fmtData(f.fim)}</div></div>
      <button class="btn sm ghost danger" data-del="${f.id}">Remover</button></div>`).join('') : '<div class="empty">Nenhuma férias registrada.</div>'}</div>
  </div>`);
  $('#fFer').onsubmit = async e => {
    e.preventDefault();
    const inicio = $('#fIni').value, fim = $('#fFim').value;
    if (!inicio || !fim) return toast('Escolha a data de saída e de volta.', true);
    if (fim < inicio) return toast('A volta precisa ser depois da saída.', true);
    try { await q(sb.from('ferias').insert({ aluno_id:S.aluno.id, inicio, fim })); toast('Férias registradas.'); await vFerias(); }
    catch (err) { erro(err); }
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    try { await q(sb.from('ferias').delete().eq('id', b.dataset.del)); toast('Férias removidas.'); await vFerias(); } catch (e) { erro(e); }
  });
}

/* ============ AGENDA (admin e professor) ============ */
async function vAgenda() {
  const admin = S.perfil.papel === 'admin';
  const dSel = parseISO(S.dataAgenda);
  let tq = sb.from('turmas').select('*').eq('dia_semana', dSel.getDay()).order('horario');
  if (!admin) tq = tq.eq('professor_id', S.user.id);
  const turmas = await q(tq);
  const ids = turmas.map(t => t.id);
  const [ags, perfis, ferias] = await Promise.all([
    ids.length ? q(sb.from('agendamentos').select('id,turma_id,status,reposicao,aluno_id,alunos(nome,telefone)').eq('data', S.dataAgenda).in('turma_id', ids).neq('status','cancelado')) : [],
    admin ? q(sb.from('perfis').select('id,nome')) : [],
    q(sb.from('ferias').select('aluno_id').lte('inicio', S.dataAgenda).gte('fim', S.dataAgenda)),
  ]);
  const nomeProf = Object.fromEntries(perfis.map(p => [p.id, p.nome]));
  const emFerias = new Set(ferias.map(f => f.aluno_id));
  const pendentes = ags.filter(a => a.status === 'agendado').length;
  const hojeISO = iso(new Date());

  view(`<div class="stack">
    <div class="row between">
      <button class="btn sm ghost" id="ant" aria-label="Dia anterior">‹</button>
      <div style="text-align:center"><div class="eyebrow">${S.dataAgenda===hojeISO?'Hoje':DIAS[dSel.getDay()]}</div>
        <h1 class="num">${pad(dSel.getDate())}/${pad(dSel.getMonth()+1)}</h1></div>
      <button class="btn sm ghost" id="prox" aria-label="Próximo dia">›</button>
    </div>
    <input class="input" type="date" id="dPick" value="${S.dataAgenda}" aria-label="Escolher data">
    ${pendentes ? `<div class="alert"><b>${pendentes} ${pendentes>1?'alunos não confirmaram':'aluno não confirmou'}</b> presença neste dia. Use o botão WhatsApp para lembrar.</div>` : ''}
    ${turmas.length ? turmas.map(t => {
      const lista = ags.filter(a => a.turma_id === t.id).sort((a,b) => (a.alunos?.nome||'').localeCompare(b.alunos?.nome||''));
      return `<section class="list">
        <div class="item" style="background:var(--surface-2)"><div class="time num">${hm(t.horario)}</div>
          <div class="grow"><div class="t">${esc(t.modalidade)}</div>
          <div class="small muted">${admin ? esc(nomeProf[t.professor_id] || 'Sem professor') + ' · ' : ''}<span class="num">${lista.length}/${t.vagas}</span> vagas</div></div>
          ${admin ? `<button class="btn sm" data-add="${t.id}">+ Aluno</button>` : ''}</div>
        ${lista.length ? lista.map(a => {
          const tel = soDigitos(a.alunos?.telefone);
          const msg = encodeURIComponent(`Oi, ${(a.alunos?.nome||'').split(' ')[0]}! Confirmando sua aula de ${t.modalidade} ${S.dataAgenda===hojeISO?'hoje':'em ' + fmtData(S.dataAgenda)} às ${hm(t.horario)} no SM|CT. Você vem?`);
          return `<div class="item" style="flex-wrap:wrap"><div class="grow">
            <div class="t">${esc(a.alunos?.nome || 'Aluno')}${a.reposicao?' · <span class="muted">reposição</span>':''}</div>
            <div class="row" style="margin-top:4px">${chip(a.status)}${emFerias.has(a.aluno_id)?'<span class="chip plain">De férias</span>':''}</div></div>
            <div class="row">
              ${a.status==='agendado' && tel ? `<a class="btn sm" href="https://wa.me/55${tel.replace(/^55/,'')}?text=${msg}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
              <button class="btn sm ${a.status==='presente'?'gold':''}" data-st="presente" data-id="${a.id}">Presente</button>
              <button class="btn sm ${a.status==='falta'?'gold':''}" data-st="falta" data-id="${a.id}">Falta</button>
              ${admin ? `<button class="btn sm ghost danger" data-canc="${a.id}" data-rep="${a.reposicao?1:0}" data-aluno="${a.aluno_id}">Cancelar</button>` : ''}
            </div></div>`;
        }).join('') : '<div class="empty">Nenhum aluno agendado.</div>'}
      </section>`;
    }).join('') : `<div class="list"><div class="empty">${admin ? 'Nenhuma turma neste dia da semana. Cadastre em Turmas.' : 'Você não tem turmas neste dia.'}</div></div>`}
  </div>`);

  const mudar = d => { S.dataAgenda = d; vAgenda().catch(erro); };
  $('#ant').onclick = () => mudar(iso(addDays(dSel, -1)));
  $('#prox').onclick = () => mudar(iso(addDays(dSel, 1)));
  $('#dPick').onchange = e => e.target.value && mudar(e.target.value);
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    try { await q(sb.from('agendamentos').update({ status:b.dataset.st }).eq('id', b.dataset.id)); await vAgenda(); } catch (e) { erro(e); }
  });
  document.querySelectorAll('[data-canc]').forEach(b => b.onclick = () => {
    const rep = b.dataset.rep === '1';
    abrirPainel(`<form class="stack"><h2>Cancelar este agendamento?</h2>
      <p class="muted" style="margin:0">${rep ? 'É uma reposição, então nenhum crédito é devolvido.' : 'O aluno recebe 1 crédito de volta.'}</p>
      <div class="row"><button type="submit" class="btn gold">Cancelar agendamento</button><button type="button" class="btn ghost" data-fechar>Voltar</button></div></form>`,
      async () => {
        await q(sb.from('agendamentos').update({ status:'cancelado' }).eq('id', b.dataset.canc));
        if (!rep) { const al = await q(sb.from('alunos').select('creditos').eq('id', b.dataset.aluno).single());
          await q(sb.from('alunos').update({ creditos: al.creditos + 1 }).eq('id', b.dataset.aluno)); }
        toast('Agendamento cancelado.'); await vAgenda();
      });
  });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
    const alunos = await q(sb.from('alunos').select('id,nome,creditos').eq('ativo', true).order('nome'));
    abrirPainel(`<form class="stack"><h2>Adicionar aluno à aula</h2>
      <label class="f">Aluno<select class="input" id="addAl" required><option value="">Escolha…</option>
        ${alunos.map(a => `<option value="${a.id}" data-c="${a.creditos}">${esc(a.nome)} (${a.creditos} créditos)</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" id="addRep"> Reposição (não desconta crédito)</label>
      <div class="row"><button type="submit" class="btn gold">Adicionar</button><button type="button" class="btn ghost" data-fechar>Voltar</button></div></form>`,
      async () => {
        const sel = $('#addAl'), alunoId = Number(sel.value), rep = $('#addRep').checked;
        if (!alunoId) throw new Error('Escolha um aluno.');
        const cred = Number(sel.selectedOptions[0].dataset.c);
        if (!rep && cred < 1) throw new Error('Esse aluno está sem créditos. Marque como reposição ou adicione créditos no cadastro.');
        await q(sb.from('agendamentos').upsert({ aluno_id:alunoId, turma_id:Number(b.dataset.add), data:S.dataAgenda, status:'agendado', reposicao:rep }, { onConflict:'aluno_id,turma_id,data' }));
        if (!rep) await q(sb.from('alunos').update({ creditos: cred - 1 }).eq('id', alunoId));
        toast('Aluno adicionado.'); await vAgenda();
      });
  });
}

/* ============ ADMIN: ALUNOS ============ */
async function vAlunos() {
  const [alunos, planos, ferias] = await Promise.all([
    q(sb.from('alunos').select('*, planos(nome)').order('nome')),
    q(sb.from('planos').select('*').order('id')),
    q(sb.from('ferias').select('*, alunos(nome)').gte('fim', iso(new Date())).order('inicio')),
  ]);
  const desenhar = () => {
    const termo = S.busca.toLowerCase();
    const vis = alunos.filter(a => !termo || a.nome.toLowerCase().includes(termo) || (a.telefone||'').includes(termo));
    $('#listaAl').innerHTML = vis.length ? vis.map(a => `<button class="item" data-al="${a.id}">
      <div class="grow"><div class="t">${esc(a.nome)}</div>
      <div class="small muted">${esc(a.planos?.nome || 'Sem plano')}${a.user_id ? ' · app ativo' : a.email ? ' · aguardando cadastro no app' : ''}</div></div>
      ${a.ativo ? '' : '<span class="chip plain">Inativo</span>'}
      <span class="num" style="font-weight:700;color:var(--gold)">${a.creditos}</span></button>`).join('')
      : '<div class="empty">Nenhum aluno encontrado.</div>';
    document.querySelectorAll('[data-al]').forEach(b => b.onclick = () => formAluno(alunos.find(a => a.id == b.dataset.al)));
  };
  view(`<div class="stack">
    <div class="row between"><h1>Alunos</h1><button class="btn gold" id="novoAl">+ Novo aluno</button></div>
    <input class="input" id="busca" type="search" placeholder="Buscar por nome ou telefone" value="${esc(S.busca)}">
    <div class="small muted"><span class="num">${alunos.filter(a=>a.ativo).length}</span> ativos · toque no aluno para editar créditos e plano</div>
    <div class="list" id="listaAl"></div>
    ${ferias.length ? `<div class="eyebrow" style="margin-top:8px">Férias registradas</div>
    <div class="list">${ferias.map(f => `<div class="item"><div class="grow"><div class="t">${esc(f.alunos?.nome)}</div>
      <div class="small muted num">${fmtData(f.inicio)} até ${fmtData(f.fim)}</div></div></div>`).join('')}</div>` : ''}
  </div>`);
  desenhar();
  $('#busca').oninput = e => { S.busca = e.target.value; desenhar(); };
  $('#novoAl').onclick = () => formAluno(null);

  function formAluno(a) {
    abrirPainel(`<form class="stack"><h2>${a ? 'Editar aluno' : 'Novo aluno'}</h2>
      <label class="f">Nome<input class="input" id="alNome" required value="${esc(a?.nome)}"></label>
      <div class="grid2">
        <label class="f">Telefone<input class="input" id="alTel" inputmode="tel" placeholder="(11) 99999-9999" value="${esc(a?.telefone)}"></label>
        <label class="f">Créditos<input class="input num" id="alCred" type="number" min="0" value="${a?.creditos ?? 0}"></label>
      </div>
      <label class="f">E-mail (o mesmo que o aluno vai usar no app)<input class="input" id="alEmail" type="email" inputmode="email" value="${esc(a?.email)}"></label>
      <label class="f">Plano<select class="input" id="alPlano"><option value="">Sem plano</option>
        ${planos.map(p => `<option value="${p.id}" ${a?.plano_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" id="alAtivo" ${a?.ativo===false?'':'checked'}> Aluno ativo</label>
      <div class="row"><button type="submit" class="btn gold">Salvar</button><button type="button" class="btn ghost" data-fechar>Voltar</button></div></form>`,
      async () => {
        const nome = $('#alNome').value.trim();
        if (!nome) throw new Error('Informe o nome do aluno.');
        const dados = { nome, telefone:$('#alTel').value.trim() || null, email:$('#alEmail').value.trim().toLowerCase() || null,
          plano_id:Number($('#alPlano').value) || null, creditos:Math.max(0, parseInt($('#alCred').value) || 0), ativo:$('#alAtivo').checked };
        if (a) await q(sb.from('alunos').update(dados).eq('id', a.id)); else await q(sb.from('alunos').insert(dados));
        toast(a ? 'Aluno atualizado.' : 'Aluno cadastrado.'); await vAlunos();
      });
  }
}

/* ============ ADMIN: TURMAS ============ */
async function vTurmas() {
  const [turmas, equipe] = await Promise.all([
    q(sb.from('turmas').select('*').order('dia_semana').order('horario')),
    q(sb.from('perfis').select('id,nome,papel').in('papel', ['professor','admin']).order('nome')),
  ]);
  const nomeProf = Object.fromEntries(equipe.map(p => [p.id, p.nome]));
  const ordem = [1,2,3,4,5,6,0];
  const grupos = ordem.map(d => [d, turmas.filter(t => t.dia_semana === d)]).filter(([,l]) => l.length);
  view(`<div class="stack">
    <div class="row between"><h1>Turmas</h1><button class="btn gold" id="novaT">+ Nova turma</button></div>
    <p class="small muted" style="margin:0">Cada turma se repete toda semana no mesmo dia e horário.</p>
    ${grupos.length ? grupos.map(([d, l]) => `<div class="eyebrow" style="margin-top:6px">${DIAS[d]}</div>
      <div class="list">${l.map(t => `<button class="item" data-t="${t.id}"><div class="time num">${hm(t.horario)}</div>
        <div class="grow"><div class="t">${esc(t.modalidade)}</div><div class="small muted">${esc(nomeProf[t.professor_id] || 'Sem professor')} · ${t.vagas} vagas</div></div></button>`).join('')}</div>`).join('')
      : '<div class="list"><div class="empty">Nenhuma turma cadastrada ainda.</div></div>'}
  </div>`);
  $('#novaT').onclick = () => formTurma(null);
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => formTurma(turmas.find(t => t.id == b.dataset.t)));

  function formTurma(t) {
    abrirPainel(`<form class="stack"><h2>${t ? 'Editar turma' : 'Nova turma'}</h2>
      <label class="f">Modalidade<input class="input" id="tMod" required list="mods" placeholder="Ex.: Jiu Jitsu, Funcional" value="${esc(t?.modalidade)}"></label>
      <datalist id="mods"><option value="Jiu Jitsu"><option value="Ginástica"><option value="Funcional"><option value="Black Space"></datalist>
      <div class="grid2">
        <label class="f">Dia<select class="input" id="tDia">${ordem.map(d => `<option value="${d}" ${t?.dia_semana===d?'selected':''}>${DIAS[d]}</option>`).join('')}</select></label>
        <label class="f">Horário<input class="input" id="tHora" type="time" required value="${hm(t?.horario) || '07:00'}"></label>
      </div>
      <div class="grid2">
        <label class="f">Professor<select class="input" id="tProf"><option value="">Sem professor</option>
          ${equipe.map(p => `<option value="${p.id}" ${t?.professor_id===p.id?'selected':''}>${esc(p.nome || 'Sem nome')}</option>`).join('')}</select></label>
        <label class="f">Vagas<input class="input num" id="tVagas" type="number" min="1" value="${t?.vagas ?? 10}"></label>
      </div>
      <div class="row"><button type="submit" class="btn gold">Salvar</button><button type="button" class="btn ghost" data-fechar>Voltar</button>
        ${t ? '<button type="button" class="btn ghost danger" id="tDel" style="margin-left:auto">Excluir turma</button>' : ''}</div></form>`,
      async () => {
        const dados = { modalidade:$('#tMod').value.trim(), dia_semana:Number($('#tDia').value), horario:$('#tHora').value,
          professor_id:$('#tProf').value || null, vagas:Math.max(1, parseInt($('#tVagas').value) || 1) };
        if (!dados.modalidade || !dados.horario) throw new Error('Preencha modalidade e horário.');
        if (t) await q(sb.from('turmas').update(dados).eq('id', t.id)); else await q(sb.from('turmas').insert(dados));
        toast(t ? 'Turma atualizada.' : 'Turma criada.'); await vTurmas();
      });
    const del = $('#tDel');
    if (del) del.onclick = async () => {
      if (del.dataset.ok !== '1') { del.dataset.ok = '1'; del.textContent = 'Toque de novo para excluir'; return; }
      try { await q(sb.from('turmas').delete().eq('id', t.id)); $('#sheet').close(); toast('Turma excluída.'); await vTurmas(); }
      catch (e) { erro({ message: e.code === '23503' ? 'Essa turma já tem agendamentos. Mude o horário em vez de excluir.' : e.message }); }
    };
  }
}

/* ============ ADMIN: EQUIPE ============ */
async function vEquipe() {
  const perfis = await q(sb.from('perfis').select('*').order('papel').order('nome'));
  view(`<div class="stack">
    <h1>Equipe e acessos</h1>
    <p class="muted small" style="margin:0">Para incluir um professor, peça que ele crie uma conta no app. Depois, mude o acesso dele aqui para Professor.</p>
    <div class="list">${perfis.map(p => `<div class="item" style="flex-wrap:wrap"><div class="grow">
      <div class="t">${esc(p.nome || 'Sem nome')}${p.id===S.user.id?' <span class="muted small">(você)</span>':''}</div>
      <div class="small muted" style="overflow-wrap:anywhere">${esc(p.email || '')}</div></div>
      <select class="input" style="width:auto;padding:8px 10px;font-size:14px" data-p="${p.id}" ${p.id===S.user.id?'disabled':''} aria-label="Acesso de ${esc(p.nome)}">
        ${['aluno','professor','admin'].map(r => `<option value="${r}" ${p.papel===r?'selected':''}>${PAPEL[r]}</option>`).join('')}</select></div>`).join('')}</div>
  </div>`);
  document.querySelectorAll('[data-p]').forEach(s => s.onchange = async () => {
    try { await q(sb.from('perfis').update({ papel:s.value }).eq('id', s.dataset.p)); toast('Acesso atualizado.'); }
    catch (e) { erro(e); }
  });
}

boot();
</script>
</body>
</html>
